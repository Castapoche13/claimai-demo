<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace sécurisé sinistres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body { background: var(--papier); }
.haut { background: var(--feuille); border-bottom: 1px solid var(--trait); }
.haut-in { max-width: 760px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.haut .cie { font-weight: 700; font-size: 17px; }
.haut .cie small { display: block; font-weight: 400; font-size: 13px; color: var(--gris); }
.cadenas { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--vert); font-weight: 600; }
main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
.carte { background: var(--feuille); border: 1px solid var(--trait); border-radius: 10px; }
.carte + .carte { margin-top: 18px; }
.carte-in { padding: 22px 24px; }
.carte h1 { font-size: 24px; }
.carte h2 { font-size: 18px; margin-bottom: 4px; }
.intro { color: var(--encre-2); margin-top: 8px; max-width: 62ch; }
.resume { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 20px; border-top: 1px solid var(--trait); padding: 18px 24px; }
.resume div { font-size: 13px; color: var(--gris); }
.resume b { display: block; color: var(--encre); font-size: 15px; font-weight: 600; margin-top: 2px; }
.recit { font-size: 14.5px; line-height: 1.6; color: var(--encre-2); border-top: 1px solid var(--trait); padding: 16px 24px; }
.recit span { display: block; font-size: 13px; color: var(--gris); margin-bottom: 4px; }
form.carte-in { display: grid; gap: 18px; }
.indice { font-size: 13.5px; padding: 10px 12px; border-radius: 6px; background: var(--feuille-2); border: 1px solid var(--trait); color: var(--encre-2); }
.indice.ko { background: var(--rouge-pale); border-color: transparent; color: var(--rouge); }
.indice.ok { background: var(--vert-pale); border-color: transparent; color: var(--vert); }
.piece { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--trait); }
.piece:first-of-type { border-top: 0; }
.piece input[type=file] { font-size: 13px; color: var(--gris); max-width: 240px; }
.piece.recue { color: var(--gris); }
.envoyer { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.etat { text-align: center; padding: 48px 24px; }
.etat .rond { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; background: var(--vert-pale); color: var(--vert); }
.etat .rond.attente { background: var(--jaune-pale); color: var(--jaune-texte); }
.etat .rond.ko { background: var(--rouge-pale); color: var(--rouge); }
.etat h1 { font-size: 22px; }
.etat p { color: var(--encre-2); margin: 10px auto 0; max-width: 52ch; }
.depot { display: grid; gap: 8px; padding: 16px; border: 1.5px dashed var(--trait-fort); border-radius: 8px; background: var(--feuille-2); }
.depot.survol { border-color: var(--bleu); background: var(--bleu-pale); }
.depot b { font-size: 14.5px; }
.depot p { font-size: 13px; color: var(--encre-2); }
.depot label.btn { justify-self: start; }
.depot input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.saisie.lu { border-color: var(--bleu); background: var(--bleu-pale); }
.lu-note { font-size: 12.5px; color: var(--bleu-fonce); }
.payer { display: grid; gap: 0; border-top: 1px solid var(--trait); }
.payer-l { display: grid; grid-template-columns: 170px 1fr auto; gap: 6px 16px; align-items: center; padding: 13px 24px; border-bottom: 1px solid var(--trait); }
.payer-l:last-child { border-bottom: 0; }
.payer-l > span:first-child { font-size: 13px; color: var(--gris); }
.payer-l b { font-weight: 600; }
.payer-l .grand { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.payer-l .iban { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15.5px; letter-spacing: .02em; word-break: normal; overflow-wrap: anywhere; }
.payer-l .sous { display: block; font-size: 12.5px; color: var(--gris); font-weight: 400; margin-top: 2px; }
.paye { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.paye .champ { flex: 1 1 240px; }
@media (max-width: 560px) { .payer-l { grid-template-columns: 1fr auto; } .payer-l > span:first-child { grid-column: 1 / -1; } }
.choix { display: grid; gap: 10px; }
.option { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 14px 16px; border: 1.5px solid var(--trait); border-radius: 8px; cursor: pointer; }
.option:has(input:checked) { border-color: var(--bleu); background: var(--bleu-pale); }
.option input { margin-top: 3px; }
.option b { font-size: 15px; }
.option .montant { font-size: 18px; font-weight: 600; white-space: nowrap; }
.option p { grid-column: 2 / -1; font-size: 13.5px; color: var(--encre-2); margin: 0; }
.encart-lien { background: none; border: 0; padding: 0; color: var(--bleu); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 560px) { .option { grid-template-columns: auto 1fr; } .option .montant { grid-column: 2; } }
.pied { font-size: 12.5px; color: var(--gris); margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>
<header class="haut"><div class="haut-in"><div class="cie" id="cie">Service sinistres<small>Espace sécurisé</small></div>
  <span class="cadenas"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Lien personnel</span></div></header>
<main id="main"><div class="carte"><div class="etat"><span class="tourne" style="display:inline-block;color:var(--bleu)"></span></div></div></main>
<div id="toast" class="toast" hidden role="status"></div>
<script src="commun.js"></script>
<script>
(function () {
"use strict";
var C = window.CA, $ = C.$, esc = C.esc, eur = C.eur;
var qs = new URLSearchParams(location.search);
var jeton = qs.get("t") || "", base = qs.get("api") || C.API_DEFAUT;
var api = C.client(base, null);
var ICONE_OK = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M7 13.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICONE_ATT = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 9v4.5l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
var ICONE_KO = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M9 9l8 8M17 9l-8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

function etat(icone, cls, titre, texte) {
  $("main").innerHTML = '<div class="carte"><div class="etat"><div class="rond ' + cls + '">' + icone + "</div><h1>" + esc(titre) + "</h1><p>" + texte + "</p></div></div>" + pied();
}
function pied() {
  return '<p class="pied">Ce lien vous est personnel et reste valable 90 jours. Les informations saisies sont transmises au service sinistres et conservées dans le dossier, conformément au RGPD. Pour toute question, répondez simplement à l\'email reçu.</p>';
}

if (!/^[0-9a-f]{64}$/.test(jeton)) {
  etat(ICONE_KO, "ko", "Ce lien n'est pas valide", "Ouvrez le lien directement depuis l'email reçu, sans le modifier. S'il a plus de 90 jours, répondez à l'email pour en recevoir un nouveau.");
  return;
}

function charger() {
  var m = qs.get("m");
  api("portail?t=" + jeton + (m && /^[0-9a-f]{32}$/.test(m) ? "&m=" + m : "")).then(afficher).catch(function (x) {
    etat(ICONE_KO, "ko", "Ce lien n'est plus valide", esc(x.message) + ". Répondez à l'email reçu pour obtenir un nouveau lien.");
  });
}

var TITRES = {
  expert_auto: ["Rapport d'expertise", "Indiquez vos conclusions. Le règlement au réparateur sera calculé sur le montant que vous retenez."],
  expert_medical: ["Conclusions médicales", "Indiquez uniquement vos conclusions. Conformément au secret médical, aucun compte rendu détaillé n'est demandé."],
  garage: ["Facture", "Après réparation, transmettez la facture, avec votre RIB s'il a changé. Garage partenaire : le règlement vous est versé directement, franchise déduite."],
  enqueteur: ["Conclusion de l'enquête", "Indiquez ce que vos vérifications ont établi. En cas de doute, un gestionnaire examine le dossier : aucune décision n'est prise automatiquement contre l'assuré."],
  assure: ["Pièces à nous transmettre", "Retrouvez ici ce que nous attendons de vous pour avancer : documents à envoyer, choix à faire. Vous pouvez répondre en plusieurs fois."]
};

// Service comptable : bon à payer, puis confirmation du virement qui clôt le dossier
function groupes(iban) { return String(iban || "").replace(/(.{4})/g, "$1 ").trim(); }
function boutonCopier(id, valeur, lib) {
  return '<button type="button" class="btn petit" data-copier="' + esc(valeur) + '" id="' + id + '">' + esc(lib || "Copier") + "</button>";
}
function origineValidation(r) {
  var p = r.valide_par || "";
  if (p === "automatique:garage_partenaire") return ["Payable sans autre validation", "Garage partenaire, montant contrôlé par Klerio"];
  if (p === "automatique:reglement_sous_seuil") return ["Validé automatiquement", "Sous le seuil de règlement automatique de votre compagnie"];
  if (p.indexOf("automatique:") === 0) return ["Validé automatiquement", ""];
  return ["Validé par un gestionnaire", p.replace(/^humain:|^outil:/, "")];
}
// Ordre de virement SEPA (pain.001.001.03) : un virement, prêt à importer dans la banque de l'assureur
function xmlEsc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function sepaTexte(s, max) {
  // Jeu de caractères SEPA : lettres sans accent, chiffres et ponctuation simple
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9 \/\-?:().,'+]/g, " ").replace(/\s+/g, " ").trim().slice(0, max);
}
function ordreSepa(c) {
  var r = c.reglement || {}, b = c.beneficiaire || {}, d = c.debiteur || {}, f = c.facture || {};
  var maintenant = new Date(), iso = maintenant.toISOString().slice(0, 19), jour = iso.slice(0, 10);
  var id = sepaTexte("KLERIO-" + c.numero + "-" + maintenant.getTime(), 35), montant = Number(r.montant_net).toFixed(2);
  var libelle = sepaTexte("SINISTRE " + c.numero + (f.numero ? " FACT " + f.numero : ""), 140);
  var agentDeb = d.bic ? "<BIC>" + xmlEsc(d.bic) + "</BIC>" : "<Othr><Id>NOTPROVIDED</Id></Othr>";
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n' +
    "<CstmrCdtTrfInitn>\n" +
    "<GrpHdr><MsgId>" + xmlEsc(id) + "</MsgId><CreDtTm>" + iso + "</CreDtTm><NbOfTxs>1</NbOfTxs><CtrlSum>" + montant + "</CtrlSum>" +
    "<InitgPty><Nm>" + xmlEsc(sepaTexte(d.titulaire || c.assureur, 70)) + "</Nm></InitgPty></GrpHdr>\n" +
    "<PmtInf><PmtInfId>" + xmlEsc(id) + "</PmtInfId><PmtMtd>TRF</PmtMtd><NbOfTxs>1</NbOfTxs><CtrlSum>" + montant + "</CtrlSum>" +
    "<PmtTpInf><SvcLvl><Cd>SEPA</Cd></SvcLvl></PmtTpInf><ReqdExctnDt>" + jour + "</ReqdExctnDt>" +
    "<Dbtr><Nm>" + xmlEsc(sepaTexte(d.titulaire || c.assureur, 70)) + "</Nm></Dbtr>" +
    "<DbtrAcct><Id><IBAN>" + xmlEsc(String(d.iban || "").replace(/\s/g, "")) + "</IBAN></Id></DbtrAcct>" +
    "<DbtrAgt><FinInstnId>" + agentDeb + "</FinInstnId></DbtrAgt><ChrgBr>SLEV</ChrgBr>\n" +
    "<CdtTrfTxInf><PmtId><EndToEndId>" + xmlEsc(sepaTexte(c.numero, 35)) + "</EndToEndId></PmtId>" +
    '<Amt><InstdAmt Ccy="EUR">' + montant + "</InstdAmt></Amt>" +
    "<Cdtr><Nm>" + xmlEsc(sepaTexte(b.titulaire || b.nom, 70)) + "</Nm></Cdtr>" +
    "<CdtrAcct><Id><IBAN>" + xmlEsc(String(b.iban || "").replace(/\s/g, "")) + "</IBAN></Id></CdtrAcct>" +
    "<RmtInf><Ustrd>" + xmlEsc(libelle) + "</Ustrd></RmtInf></CdtTrfTxInf>\n" +
    "</PmtInf>\n</CstmrCdtTrfInitn>\n</Document>\n";
}
function afficherComptable(c) {
  var r = c.reglement || {}, b = c.beneficiaire || {}, f = c.facture, o = origineValidation(r);
  var recent = b.iban_maj_le && (Date.now() - new Date(b.iban_maj_le).getTime()) < 30 * 864e5;
  var h = '<div class="carte"><div class="carte-in"><span class="muet petit">Service comptable</span><h1>Bon à payer, dossier ' + esc(c.numero) + "</h1>" +
    '<p class="intro">' + (c.reponse_attendue ? "Le règlement est validé : il ne reste que le virement. Indiquez sa référence en bas de page une fois qu'il est fait, le dossier se clôturera tout seul."
      : "Ce règlement est payé. Rien d'autre n'est attendu de votre part.") + "</p></div>" +
    '<div class="payer">' +
      '<div class="payer-l"><span>Montant à virer</span><span class="grand">' + esc(eur(r.montant_net)) +
        '<span class="sous">' + esc(eur(r.montant_base)) + " TTC" + (Number(r.franchise) ? ", franchise de " + esc(eur(r.franchise)) + " déduite" : "") + "</span></span>" + boutonCopier("cp-montant", String(r.montant_net), "Copier") + "</div>" +
      '<div class="payer-l"><span>Bénéficiaire</span><b>' + esc(b.titulaire || b.nom || "") + (b.type === "garage" ? '<span class="sous">' + (b.partenaire ? "Garage partenaire" : "Garage") + "</span>" : "") + "</b><span></span></div>" +
      '<div class="payer-l"><span>IBAN</span>' + (b.iban ? '<span class="iban">' + esc(groupes(b.iban)) + "</span>" + boutonCopier("cp-iban", b.iban)
        : '<span class="muet">' + esc(b.note || "IBAN absent du référentiel des garages : prenez celui de votre fichier fournisseurs.") + "</span><span></span>") + "</div>" +
      '<div class="payer-l"><span>Libellé du virement</span><b>' + esc(r.libelle_virement || "") + "</b>" + boutonCopier("cp-libelle", r.libelle_virement || "") + "</div>" +
      (f ? '<div class="payer-l"><span>Facture</span><b>' + (f.numero ? "N° " + esc(f.numero) : "Facture du garage") + '<span class="sous">' + esc(eur(f.montant_ttc)) + " TTC, reçue le " + esc(C.dateFr(f.recue_le)) + "</span></b>" +
        (f.document_id ? '<button type="button" class="btn petit" id="b-facture" data-doc="' + esc(f.document_id) + '">Ouvrir la facture</button>' : "<span></span>") + "</div>" : "") +
      '<div class="payer-l"><span>Validation</span><b>' + esc(o[0]) + '<span class="sous">' + esc([o[1], r.valide_le ? "le " + C.dateFr(r.valide_le) : ""].filter(Boolean).join(", ")) + "</span></b><span></span></div>" +
    "</div>" +
    (recent && c.reponse_attendue ? '<div class="carte-in" style="padding-top:0"><p class="indice ko">L\'IBAN de ce garage a été modifié le ' + esc(C.dateFr(b.iban_maj_le)) + " : en cas de doute, confirmez-le par téléphone avec le garage avant de payer.</p></div>" : "") +
    "</div>";
  if (c.reponse_attendue && b.iban) {
    var deb = c.debiteur || {};
    h += '<div class="carte"><div class="carte-in"><h2>Programmer le virement</h2>' +
      '<p class="intro">Téléchargez l\'ordre de virement déjà rempli (montant, IBAN du bénéficiaire, libellé, n° de facture) et importez-le dans votre banque ou votre logiciel de paiement : il ne reste qu\'à le signer. Format SEPA standard, accepté par les banques françaises.</p>' +
      (deb.iban ? '<p class="muet petit">Compte débité : ' + esc(deb.titulaire || "") + " · " + esc(groupes(deb.iban)) + "</p>" +
        '<p style="margin-top:10px"><button type="button" class="btn primaire" id="b-sepa">Télécharger l\'ordre de virement (SEPA)</button></p>'
        : '<p class="indice ko">Le compte qui paie les sinistres n\'est pas encore renseigné dans les réglages de Klerio (Raccordement, Paiement des garages) : ajoutez-le pour obtenir l\'ordre de virement prérempli.</p>') +
      "</div></div>";
  }
  if (c.reponse_attendue) {
    h += '<div class="carte"><form class="carte-in" id="form" novalidate><h2>Virement effectué</h2>' +
      '<div class="paye"><label class="champ">Référence du virement <span class="aide">celle de votre banque ou de votre logiciel</span><input class="saisie" id="f-ref" maxlength="80" autocomplete="off" required></label>' +
      '<button class="btn primaire" id="b-envoyer" type="submit">Confirmer le paiement</button></div></form></div>';
  } else {
    h += '<div class="carte"><div class="etat"><div class="rond">' + ICONE_OK + "</div><h1>Payé" + (r.confirme_le ? " le " + esc(C.dateFr(r.confirme_le)) : "") + "</h1><p>" +
      (r.ref_virement ? "Référence du virement : " + esc(r.ref_virement) + ". " : "") + "Le dossier est clôturé.</p></div></div>";
  }
  $("main").innerHTML = h + pied();
  document.querySelectorAll("[data-copier]").forEach(function (bt) {
    bt.addEventListener("click", function () {
      var v = bt.getAttribute("data-copier");
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { bt.textContent = "Copié"; setTimeout(function () { bt.textContent = "Copier"; }, 1600); },
        function () { C.toast("Copie impossible : sélectionnez la valeur à la main", true); });
    });
  });
  var bs = $("b-sepa");
  if (bs) bs.addEventListener("click", function () {
    var xml = ordreSepa(c), nom = "virement-" + c.numero + ".xml";
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([xml], { type: "application/xml" })); a.download = nom;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    C.toast("Ordre de virement téléchargé : importez-le dans votre banque");
  });
  var bf = $("b-facture");
  if (bf) bf.addEventListener("click", function () {
    C.occupe(bf, true, "Ouverture");
    api("portail/document?t=" + jeton + "&id=" + encodeURIComponent(bf.getAttribute("data-doc"))).then(function (x) {
      C.occupe(bf, false); window.open(x.url, "_blank", "noopener");
    }).catch(function (x) { C.occupe(bf, false); C.toast(x.message, true); });
  });
  var fm = $("form");
  if (fm) fm.addEventListener("submit", function (e) {
    e.preventDefault();
    var ref = $("f-ref").value.trim();
    if (!ref) return C.toast("Indiquez la référence du virement.", true);
    var bt = $("b-envoyer"); C.occupe(bt, true, "Envoi");
    api("portail", { body: { t: jeton, ref_virement: ref } }).then(function () {
      etat(ICONE_OK, "", "Paiement confirmé", "Le dossier " + esc(c.numero) + " est clôturé. Merci.");
    }).catch(function (x) { C.occupe(bt, false); C.toast(x.message, true); });
  });
}

// Choix de l'assuré : véhicule irréparable, véhicule volé retrouvé, garage
function envoyerChoix(btn, corps, ok) {
  C.occupe(btn, true, "Envoi");
  corps.t = jeton;
  return api("portail", { body: corps }).then(function () { C.toast(ok); charger(); })
    .catch(function (x) { C.occupe(btn, false); C.toast(x.message, true); });
}
function radio(nom, valeur, lib) { return '<label class="case"><input type="radio" name="' + nom + '" value="' + valeur + '"> ' + esc(lib) + "</label>"; }
function blocQuestionnaireVol() {
  return '<div class="carte"><form class="carte-in" id="form-qv" novalidate><h2>Questionnaire sur le vol</h2>' +
    '<p class="intro">Quelques questions sur les circonstances, obligatoires pour traiter votre dossier. Répondez le plus précisément possible.</p>' +
    '<fieldset class="champ"><legend>Où se trouvaient les clés au moment du vol ?</legend>' + radio("qv-cles", "avec_moi", "Sur moi ou avec la personne qui utilisait le véhicule") +
      radio("qv-cles", "domicile", "À mon domicile") + radio("qv-cles", "dans_vehicule", "Dans ou sur le véhicule") + radio("qv-cles", "volees", "Elles ont été volées aussi (cambriolage, vol de sac...)") + "</fieldset>" +
    '<div class="grille-2"><label class="champ">Nombre de jeux de clés que vous pouvez remettre<input class="saisie" id="qv-nb" type="number" min="0" max="9" step="1" value="2"></label>' +
    '<label class="champ">Dernière utilisation du véhicule <span class="aide">date et heure</span><input class="saisie" id="qv-der" type="datetime-local"></label></div>' +
    '<fieldset class="champ"><legend>Où le véhicule était-il stationné ?</legend>' + radio("qv-st", "garage_ferme", "Dans un garage fermé") + radio("qv-st", "parking_prive", "Sur un parking privé ou une cour") +
      radio("qv-st", "voie_publique", "Sur la voie publique") + radio("qv-st", "autre", "Ailleurs") + "</fieldset>" +

        "<p>Valeur de remplacement, franchise de " + esc(eur(v.franchise_eur)) + " déduite. Nous nous chargeons de l'épave. Il vous faudra le certificat de cession signé et la carte grise barrée.</p></label>" +

      '<p class="petit muet">Vous contestez la valeur retenue ? Répondez à l\'email reçu avec vos justificatifs, ou demandez une contre-expertise.</p>' +

  }
  if (vr && vr.apres_indemnisation && !vr.choix) {

      '<p class="intro">Vous avez déjà été indemnisé (' + esc(eur(vr.indemnite)) + "). Selon les conditions de votre contrat, choisissez avant le " + esc(C.dateFr(vr.echeance)) + ".</p><div class=\"choix\">" +
      '<label class="option"><input type="radio" name="vr" value="garder_indemnite"><b>Je garde l\'indemnité</b><span></span><p>Le véhicule devient la propriété de votre assureur, qui s\'en charge.</p></label>' +
      '<label class="option"><input type="radio" name="vr" value="reprendre_vehicule"><b>Je reprends mon véhicule</b><span class="montant">' + esc(eur(vr.indemnite)) + "</span><p>Vous remboursez l'indemnité. Les dégâts éventuels sont pris en charge selon votre contrat.</p></label></div>" +
      '<div class="envoyer"><button class="btn primaire" id="b-vr" type="submit">Valider mon choix</button></div></form></div>';
  }
  if (c.peut_signaler_retrouve) {
    h += '<div class="carte"><form class="carte-in" id="form-retrouve" novalidate><h2>Votre véhicule a été retrouvé ?</h2>' +
      '<p class="intro">Signalez-le ici : nous organisons son expertise et sa remise en état' + (c.statut === "clos" || c.statut === "reglement_envoye" ? ", ou vous proposons de le reprendre" : "") + ".</p>" +
      '<label class="champ">Où et quand <span class="aide">facultatif</span><textarea class="saisie" id="f-retrouve" rows="2" maxlength="500" placeholder="Ex. retrouvé par la police à Melun le 2 octobre"></textarea></label>' +
      '<div class="envoyer"><button class="btn" id="b-retrouve" type="submit">Mon véhicule a été retrouvé</button></div></form></div>';
  }
  if (g) {
    var autres = (g.proposes || []).filter(function (x) { return !g.actuel || x.nom !== g.actuel.nom; });
    h += '<div class="carte"><div class="carte-in"><h2>Votre réparateur</h2><p class="intro">' +
      (g.actuel ? "<b>" + esc(g.actuel.nom) + "</b> (" + esc(g.actuel.code_postal) + ")" + (g.actuel.hors_reseau ? ", garage de votre choix hors réseau." : ", garage partenaire.") : "") +

      '<label class="option"><input type="radio" name="gar" value="autre"' + (autres.length ? "" : " checked") + '><b>Un garage hors réseau</b><span></span><p>Votre garage habituel par exemple. La réparation reste prise en charge selon votre contrat, après vérification de sa facture.</p></label>' +

  }
  return h;
}
function brancherAssure() {
  var fq = $("form-qv");
  if (fq) {
    var majEff = function () { var x = document.querySelector('input[name="qv-st"]:checked'); $("qv-eff-l").hidden = !x || x.value !== "garage_ferme"; };
    fq.querySelectorAll('input[name="qv-st"]').forEach(function (r) { r.addEventListener("change", majEff); });
    fq.addEventListener("submit", function (e) {
      e.preventDefault();
      var cl = document.querySelector('input[name="qv-cles"]:checked'), st = document.querySelector('input[name="qv-st"]:checked');
      if (!cl || !st) return C.toast("Indiquez où se trouvaient les clés et où le véhicule était stationné.", true);
      envoyerChoix($("b-qv"), { questionnaire_vol: { cles: cl.value, nb_cles: Number($("qv-nb").value || 0), stationnement: st.value,
        effraction_garage: st.value === "garage_ferme" ? $("qv-eff").checked : undefined, antivol: $("qv-antivol").checked, en_vente: $("qv-vente").checked,
        derniere_utilisation: $("qv-der").value || undefined, commentaire: $("qv-com").value.trim() || undefined } }, "Merci, vos réponses sont enregistrées");
    });
  }
  var fv = $("form-vei");
  if (fv) fv.addEventListener("submit", function (e) {
    e.preventDefault(); var x = document.querySelector('input[name="vei"]:checked');
    if (!x) return C.toast("Choisissez une des deux possibilités.", true);
    envoyerChoix($("b-vei"), { choix_vei: x.value }, "Choix enregistré");
  });
  var fr = $("form-vr");
  if (fr) fr.addEventListener("submit", function (e) {
    e.preventDefault(); var x = document.querySelector('input[name="vr"]:checked');
    if (!x) return C.toast("Choisissez une des deux possibilités.", true);
    envoyerChoix($("b-vr"), { choix_vol_retrouve: x.value }, "Choix enregistré");
  });
  var ft = $("form-retrouve");
  if (ft) ft.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!confirm("Confirmer que votre véhicule a été retrouvé ?")) return;
    envoyerChoix($("b-retrouve"), { vehicule_retrouve: true, commentaire: $("f-retrouve").value.trim() || undefined }, "Merci, c'est noté");
  });
  var ba = $("b-autre-garage"), fg = $("form-garage");
  if (ba && fg) {
    ba.addEventListener("click", function () { fg.hidden = !fg.hidden; ba.textContent = fg.hidden ? "Choisir un autre garage" : "Garder ce garage"; });
    var majAutre = function () { var x = document.querySelector('input[name="gar"]:checked'); $("gar-autre").hidden = !x || x.value !== "autre"; };
    fg.querySelectorAll('input[name="gar"]').forEach(function (r) { r.addEventListener("change", majAutre); }); majAutre();
    fg.addEventListener("submit", function (e) {
      e.preventDefault(); var x = document.querySelector('input[name="gar"]:checked'); if (!x) return;
      var cg = x.value === "autre" ? { nom: $("g-nom").value.trim(), email: $("g-email").value.trim(), code_postal: $("g-cp").value.trim() } : { garage_id: x.value };
      if (x.value === "autre" && (!cg.nom || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cg.email) || !/^\d{5}$/.test(cg.code_postal)))
        return C.toast("Indiquez le nom, l'email et le code postal du garage.", true);
      envoyerChoix($("b-garage"), { choix_garage: cg }, "Garage enregistré");
    });
  }
}

function afficher(c) {
  $("cie").innerHTML = esc(c.assureur || "Service sinistres") + "<small>Service sinistres, espace sécurisé</small>";
  document.title = "Dossier " + c.numero + ", " + (c.assureur || "service sinistres");
  if (c.role === "comptable") { document.title = "Bon à payer " + c.numero; return afficherComptable(c); }
  var t = TITRES[c.role] || ["Votre dossier", ""];
  var h = '<div class="carte"><div class="carte-in"><span class="muet petit">' + esc(C.ROLES[c.role] || "") + "</span><h1>Dossier " + esc(c.numero) + '</h1><p class="intro">' + esc(t[1]) + "</p></div>" +
    '<div class="resume"><div>Type<b>' + esc(C.theme(c.theme)) + "</b></div><div>Date du sinistre<b>" + esc(C.dateFr(c.date_sinistre)) + "</b></div>" +
    "<div>Lieu<b>" + esc([c.lieu && c.lieu.ville, c.lieu && c.lieu.code_postal].filter(Boolean).join(" ") || "Non précisé") + "</b></div>" +
    (c.vehicule ? "<div>Véhicule<b>" + esc(c.vehicule) + "</b></div>" : "") +
    (c.age_victime != null ? "<div>Âge de la victime<b>" + esc(c.age_victime) + " ans</b></div>" : "") +
    (c.expertise_retenue ? "<div>Retenu par l'expert<b>" + esc(eur(c.expertise_retenue.ttc)) + " TTC</b></div>" : "") + "</div>" +
    (c.recit ? '<div class="recit"><span>Circonstances déclarées</span>' + esc(c.recit) + "</div>" : "") + "</div>";
  // Lien ouvert depuis un ancien message : le dossier a avancé depuis
  if (c.message && c.message.depasse) {
    h += '<div class="carte"><div class="carte-in"><p class="indice">Votre dossier a avancé depuis le message du ' + esc(C.dateFr(c.message.message_du)) +
      ". Dernier message envoyé le " + esc(C.dateFr(c.message.dernier_le)) + " : « " + esc(c.message.dernier_objet) + " ». Cette page montre la situation à jour.</p></div></div>";
  }

  if (c.role === "garage" && c.mission_annulee) {
    h += '<div class="carte"><div class="etat"><div class="rond ko">' + ICONE_KO + "</div><h1>Prise en charge annulée</h1><p>Ce dossier ne vous est plus confié : l'assuré a choisi un autre réparateur, ou le véhicule n'est pas réparable. N'engagez aucun travaux.</p></div></div>";
    $("main").innerHTML = h + pied(); return;
  }
  var extra = c.role === "assure" ? blocsAssure(c) : "";
  var piecesAssure = c.role === "assure" && (c.pieces_attendues || []).some(function (p) { return !p.recue && p.code !== "QUESTIONNAIRE_VOL"; });
  if (c.role === "assure" && (extra || !piecesAssure) && (c.reponse_attendue || extra)) {
    h += extra;
    if (piecesAssure) {
      h += '<div class="carte"><form class="carte-in" id="form" novalidate><h2>' + esc(t[0]) + "</h2>" + formulaire(c) +
        '<div class="envoyer"><button class="btn primaire" id="b-envoyer" type="submit">Envoyer au service sinistres</button></div></form></div>';
    } else if (!extra.match(/<form/)) {
      h += '<div class="carte"><div class="etat"><div class="rond">' + ICONE_OK + "</div><h1>Nous avons tout ce qu'il nous faut</h1><p>Vous serez informé par email de la suite du dossier.</p></div></div>";
    }
    $("main").innerHTML = h + pied();
    brancherAssure();
    if (piecesAssure) brancher(c);
    return;
  }
  if (!c.reponse_attendue) {
    var fini = ["clos", "refuse", "classe_sans_suite"].indexOf(c.statut) >= 0;
    h += '<div class="carte"><div class="etat"><div class="rond">' + ICONE_OK + "</div><h1>" + (fini ? "Ce dossier est terminé" : "Nous avons tout ce qu'il nous faut") +
      "</h1><p>" + (fini ? "Aucune action n'est attendue de votre part." : "Votre réponse a bien été reçue. Vous serez informé par email de la suite du dossier.") + "</p></div></div>";
    $("main").innerHTML = h + pied(); return;
  }
  if (c.role === "garage" && c.expertise_requise) {
    h += '<div class="carte"><div class="etat"><div class="rond attente">' + ICONE_ATT + "</div><h1>En attente du passage de l'expert</h1><p>N'engagez pas les travaux avant son rapport. Vous recevrez un email dès qu'il sera rendu, et ce même lien vous permettra d'envoyer la facture.</p></div></div>";
    $("main").innerHTML = h + pied(); return;
  }
  h += '<div class="carte"><form class="carte-in" id="form" novalidate><h2>' + esc(t[0]) + "</h2>" + zoneDepot(c) + formulaire(c) +
    '<div class="envoyer"><button class="btn primaire" id="b-envoyer" type="submit">Envoyer au service sinistres</button><span class="muet petit">Vous pourrez vérifier votre envoi juste après.</span></div></form></div>';
  $("main").innerHTML = h + pied();
  brancher(c);
}

function zoneDepot(c) {
  var fac = c.role === "garage" && (c.pieces_attendues || []).some(function (p) { return p.code === "FACTURE" && !p.recue; });
  if (c.role !== "expert_auto" && c.role !== "expert_medical" && !fac) return "";
  if (c.role === "expert_auto" && c.cles_attendues && !c.evaluation_vol) return "";
  var quoi = c.role === "expert_auto" ? "votre rapport d'expertise" : c.role === "expert_medical" ? "vos conclusions médicales" : "votre facture";
  return '<div class="depot" id="depot"><b>Gagnez du temps : déposez ' + quoi + "</b>" +
    "<p>PDF ou photo, 8 Mo au maximum. Le formulaire se remplit tout seul ; vous vérifiez chaque valeur avant d'envoyer.</p>" +
    (c.role === "expert_medical" ? "<p><b>Secret médical :</b> le document est lu puis supprimé aussitôt. Seuls le taux d'AIPP, la date de consolidation et la mention de dépendance sont conservés.</p>" : "") +
    '<label class="btn" for="f-fichier">Choisir un fichier</label><input type="file" id="f-fichier" accept="application/pdf,image/jpeg,image/png,image/webp">' +
    '<p class="petit muet" id="depot-etat" role="status"></p></div>';
}

function num(id, lib, aide, attrs) {
  return '<label class="champ">' + esc(lib) + (aide ? ' <span class="aide">' + esc(aide) + "</span>" : "") + '<input class="saisie" id="' + id + '" type="number" inputmode="decimal" step="0.01" min="0" ' + (attrs || "") + "></label>";
}

function champsCles() {

    '<label class="champ">Observations sur les clés <span class="aide">lecture des clés, usure, copie...</span><textarea class="saisie" id="f-cles-obs" rows="2" maxlength="500"></textarea></label>';
}
function formulaire(c) {

      (q.cles ? '<p class="muet petit">Questionnaire de l\'assuré : clés ' + esc(q.cles) + ", " + esc(q.nb_cles) + " jeu(x), stationnement " + esc(q.stationnement) + (q.derniere_utilisation ? ", dernière utilisation " + esc(q.derniere_utilisation) : "") + "</p>" : "") +
      '<fieldset class="champ"><legend>Conclusion</legend>' + radio("f-conc", "vol_confirme", "Le vol est établi") + radio("f-conc", "doute", "Des doutes subsistent") +

  if (c.role === "expert_medical") return '<div class="grille-2">' + num("f-aipp", "Taux d'AIPP", "en %", 'required max="100" step="0.5"') +

    return (fac ? '<div class="grille-2">' + num("f-ttc", "Montant de la facture", "TTC, en €", "required") + num("f-ht", "Montant de la facture", "HT, en €") + "</div>" +

      // ancienne délégation de paiement : affichée seulement si un dossier antérieur l'attend encore

  }
  return (c.pieces_attendues || []).filter(function (p) { return p.code !== "QUESTIONNAIRE_VOL"; }).map(function (p) {
    return '<div class="piece' + (p.recue ? " recue" : "") + '"><label class="case"><input type="checkbox" name="piece" value="' + esc(p.code) + '"' + (p.recue ? " checked disabled" : "") + "> <span><b>" + esc(C.PIECES[p.code] || p.libelle) + "</b>" +
      (p.recue ? '<br><span class="muet petit">Déjà reçue</span>' : "") + "</span></label>" + (p.recue ? "<span></span>" : '<input type="file" aria-label="Fichier ' + esc(p.libelle) + '" accept=".pdf,.jpg,.jpeg,.png">') + "</div>";
  }).join("") + '<p class="muet petit">Démonstration : seul l\'envoi de chaque pièce est enregistré, les fichiers ne sont pas conservés.</p>';
}

function val(id) { var e = $(id); if (!e || e.value === "") return undefined; return Number(e.value); }

// Champs du formulaire remplis par la lecture du document
var CHAMPS_LUS = {
  expert_auto: [["f-devis", "montant_devis_ttc"], ["f-ttc", "montant_ttc"], ["f-ht", "montant_ht"], ["f-taux", "taux_horaire"], ["f-heures", "heures"],
    ["f-pieces", "montant_pieces_ht"], ["f-vei", "vei"], ["f-direct", "reglement_direct_autorise"], ["f-conclusion", "conclusion"]],
  expert_medical: [["f-aipp", "aipp_pct"], ["f-conso", "date_consolidation"], ["f-dep", "dependance_totale"]],
  garage: [["f-ttc", "montant_ttc"], ["f-ht", "montant_ht"], ["f-num", "numero_facture"], ["f-deleg", "delegation_paiement"], ["f-conclusion", "conclusion"]]
};
function brancherDepot(c) {
  var inp = $("f-fichier"), zone = $("depot"), etatD = $("depot-etat");
  if (!inp) return;
  function lire(fichier) {
    if (!fichier) return;
    if (["application/pdf", "image/jpeg", "image/png", "image/webp"].indexOf(fichier.type) < 0) { etatD.textContent = "Format non accepté : PDF, JPEG, PNG ou WebP."; return; }
    if (fichier.size > 8 * 1024 * 1024) { etatD.textContent = "Fichier trop lourd : 8 Mo au maximum."; return; }
    etatD.innerHTML = '<span class="tourne" style="vertical-align:-2px"></span> Lecture de « ' + esc(fichier.name) + " »…";
    var lr = new FileReader();
    lr.onload = function () {
      var b64 = String(lr.result).split(",")[1] || "";
      api("portail/lire?t=" + jeton, { body: { nom_fichier: fichier.name, type_mime: fichier.type, contenu_base64: b64 } }).then(function (r) {
        var v = r.valeurs || {}, n = 0;
        (CHAMPS_LUS[c.role] || []).forEach(function (k) {
          var el = $(k[0]); if (!el || v[k[1]] === undefined || el.disabled) return;
          if (el.type === "checkbox") { if (k[0] === "f-deleg" && v[k[1]] !== true) return; el.checked = !!v[k[1]]; }
          else el.value = v[k[1]];
          el.classList.add("lu"); n++;
          el.dispatchEvent(new Event("input", { bubbles: true }));
        });
        var ko = (r.controles || []).filter(function (x) { return x.niveau === "ko" && x.code !== "LECTURE_INCERTAINE"; });
        var h = n ? "<b>" + n + " valeur" + (n > 1 ? "s" : "") + " lue" + (n > 1 ? "s" : "") + " dans le document</b>, surlignée" + (n > 1 ? "s" : "") + " en bleu. Vérifiez-les avant d'envoyer."
                  : "<b>Aucune valeur exploitable trouvée</b> : complétez le formulaire à la main.";
        if (r.confiance != null && r.confiance < 0.8) h += "<br>Lecture peu sûre (document flou ou incomplet) : contrôlez chaque valeur.";
        ko.forEach(function (x) { h += "<br>Attention : " + esc(x.detail); });
        h += r.medical ? "<br>Le document a été lu puis supprimé." : "";
        etatD.innerHTML = h;
      }).catch(function (x) { etatD.textContent = x.message; });
    };
    lr.onerror = function () { etatD.textContent = "Impossible de lire ce fichier sur votre appareil."; };
    lr.readAsDataURL(fichier);
  }
  inp.addEventListener("change", function () { lire(inp.files[0]); inp.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) { zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add("survol"); }); });
  ["dragleave", "drop"].forEach(function (ev) { zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove("survol"); }); });
  zone.addEventListener("drop", function (e) { lire(e.dataTransfer && e.dataTransfer.files[0]); });
  document.querySelectorAll("#form .saisie").forEach(function (el) { el.addEventListener("input", function (e) { if (e.isTrusted) el.classList.remove("lu"); }); });
}

function brancher(c) {
  brancherDepot(c);
  var vei = $("f-vei"), bloc = $("f-vei-bloc");
  if (vei && bloc) { var maj = function () { bloc.hidden = !vei.checked; }; vei.addEventListener("change", maj); vei.addEventListener("input", maj); maj(); }
  var coh = $("f-coherence");
  if (coh) ["f-taux", "f-heures", "f-pieces", "f-ht", "f-ttc"].forEach(function (id) {
    $(id).addEventListener("input", function () {
      var t = val("f-taux"), h = val("f-heures"), p = val("f-pieces"), ht = val("f-ht") || (val("f-ttc") ? val("f-ttc") / 1.2 : undefined);
      if (t == null || h == null || p == null || !ht) { coh.className = "indice"; coh.textContent = "Renseignez le détail du chiffrage pour vérifier sa cohérence."; return; }
      var calc = t * h + p, ecart = Math.abs(calc - ht) / ht * 100;
      coh.className = "indice " + (ecart > 10 ? "ko" : "ok");
      coh.textContent = "Main-d'œuvre et pièces : " + eur(calc) + " HT pour " + eur(ht) + " HT retenus" + (ecart > 10 ? ". L'écart dépasse 10 % : le dossier sera revu par un gestionnaire." : ", chiffrage cohérent.");
    });
  });
  var ec = $("f-ecart");
  if (ec && c.expertise_retenue) $("f-ttc").addEventListener("input", function () {
    var v = val("f-ttc"), r = Number(c.expertise_retenue.ttc); if (!v) return;
    var e = (v - r) / r * 100;
    ec.className = "indice " + (e > 5 ? "ko" : "ok");
    ec.textContent = "Montant retenu par l'expert : " + eur(r) + " TTC. " + (e > 5 ? "Votre facture le dépasse de " + C.nombre(e, 1) + " % : elle sera examinée avant règlement." : "Facture conforme à l'expertise.");
  });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var r = {};
    if (c.role === "enqueteur") {
      var cc = document.querySelector('input[name="f-conc"]:checked');
      r = { conclusion: cc && cc.value, synthese: $("f-syn").value.trim() };
      if (!r.conclusion || r.synthese.length < 20) return C.toast("Choisissez une conclusion et résumez vos constatations.", true);
    } else if (c.role === "expert_auto" && !$("f-ttc")) {
      r = { cles_recues: val("f-cles"), cles_conformes: $("f-cles-ok").checked, cles_observations: $("f-cles-obs").value.trim() || undefined };
      if (r.cles_recues == null) return C.toast("Indiquez le nombre de jeux de clés reçus.", true);
    } else if (c.role === "expert_auto") {
      r = { montant_devis_ttc: val("f-devis"), montant_ttc: val("f-ttc"), montant_ht: val("f-ht"), taux_horaire: val("f-taux"), heures: val("f-heures"),
        montant_pieces_ht: val("f-pieces"), vei: $("f-vei").checked, reglement_direct_autorise: $("f-direct").checked, conclusion: $("f-conclusion").value.trim() || undefined,
        vetuste_ttc: val("f-vet"), vrade_ttc: val("f-vrade"), valeur_epave_ttc: val("f-epave") };
      if (!r.montant_ttc) return C.toast("Indiquez le montant retenu TTC.", true);
      if ($("f-cles") && val("f-cles") != null) { r.cles_recues = val("f-cles"); r.cles_conformes = $("f-cles-ok").checked; r.cles_observations = $("f-cles-obs").value.trim() || undefined; }
      if (r.vei && !c.evaluation_vol && (!r.vrade_ttc || r.valeur_epave_ttc == null)) return C.toast("Véhicule irréparable : indiquez la valeur de remplacement et la valeur de l'épave.", true);
    } else if (c.role === "expert_medical") {
      r = { aipp_pct: val("f-aipp"), date_consolidation: $("f-conso").value || undefined, dependance_totale: $("f-dep").checked, conclusion: $("f-conclusion").value.trim() || undefined };
      if (r.aipp_pct == null || r.aipp_pct > 100) return C.toast("Indiquez un taux d'AIPP entre 0 et 100 %.", true);
    } else if (c.role === "garage") {
      r = { delegation_paiement: $("f-deleg") ? $("f-deleg").checked : false };
      if ($("f-ttc")) { r.montant_ttc = val("f-ttc"); r.montant_ht = val("f-ht"); r.conclusion = ($("f-conclusion").value || "").trim() || undefined; r.numero_facture = ($("f-num").value || "").trim() || undefined; if (!r.montant_ttc) return C.toast("Indiquez le montant TTC de la facture.", true); }
      else if (!r.delegation_paiement) return C.toast($("f-deleg") ? "Cochez la délégation de paiement pour l'envoyer." : "Rien d'autre n'est attendu de votre part.", true);
    } else {
      r.pieces = Array.prototype.map.call(document.querySelectorAll('input[name=piece]:checked:not(:disabled)'), function (x) { return x.value; });
      if (!r.pieces.length) return C.toast("Cochez au moins une pièce à envoyer.", true);
    }
    r.t = jeton;
    var b = $("b-envoyer"); C.occupe(b, true, "Envoi");
    api("portail", { body: r }).then(function () {
      etat(ICONE_OK, "", "Merci, c'est transmis", "Le service sinistres a bien reçu votre réponse pour le dossier " + esc(c.numero) + ". Vous serez informé par email de la suite.");
    }).catch(function (x) { C.occupe(b, false); C.toast(x.message, true); });
  });
}

charger();
})();
</script>
</body>
</html>
