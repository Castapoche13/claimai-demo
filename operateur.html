<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest-operateur.webmanifest">
<meta name="theme-color" content="#0E0E10">
<meta name="robots" content="noindex">
<title>Klerio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261105a">
<link rel="stylesheet" href="charte.css?v=20261108j">
<style>
body { background: var(--papier); }
.op-connexion { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px;
  background: radial-gradient(1100px 600px at 50% -10%, rgba(217,174,69,.16), transparent 60%), radial-gradient(800px 500px at 50% 110%, rgba(46,77,158,.18), transparent 60%), #0E0E10; }
.op-carte { width: min(380px, 100%); display: grid; gap: 28px; justify-items: center; }
.op-carte .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #F3F3F1; letter-spacing: -0.01em; }
.op-carte .logo svg { width: 34px; height: 34px; }
.op-connexion form { width: 100%; display: grid; gap: 16px; padding: 28px; border-radius: 16px; color: #ECECEE;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025)); border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 24px 60px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.op-connexion form .champ { color: #A2A2AA; font-size: 13px; }
.op-connexion form .saisie { height: 44px; background: rgba(0,0,0,.35); color: #F3F3F1; border: 1px solid rgba(255,255,255,.12); }
.op-connexion form .saisie:focus { border-color: #D9AE45; box-shadow: 0 0 0 3px rgba(217,174,69,.18); outline: none; }
.op-connexion form[hidden] { display: none; }
.op-connexion .erreur-form { color: #F28B82; }
.op-connexion .btn.primaire { height: 44px; justify-content: center; background: #D9AE45; color: #09090B; border-color: #D9AE45; font-weight: 600; }
.op-connexion .btn.primaire:hover { background: #E4BC57; }
.op-tete { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--feuille); border-bottom: 1px solid var(--trait); }
.op-tete .marque { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.op-tete .role { font-size: 12.5px; color: var(--gris); border-left: 1px solid var(--trait); padding-left: 12px; }
.op-tete .droite { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13.5px; }
.op-page { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; display: grid; gap: 20px; }
.op-chiffres { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.op-chiffres .c { background: var(--feuille); border: 1px solid var(--trait); border-radius: 14px; padding: 16px 18px; }
.op-chiffres .c b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.op-chiffres .c span { font-size: 13px; color: var(--gris); }
.op-chiffres .c.alerte-c b { color: var(--rouge, #b42318); }
.onglets { display: flex; gap: 2px; border-bottom: 1px solid var(--trait); overflow-x: auto; }
.onglets a { padding: 10px 14px; font-size: 14px; font-weight: 500; color: var(--gris); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; text-decoration: none; }
.onglets a:hover { color: var(--encre); }
.onglets a[aria-current="page"] { color: var(--encre); border-bottom-color: #D9AE45; }
.carte-equipe .tableau { width: 100%; }
.carte-equipe .tableau td { padding: 10px 14px; }
.carte-centre span { line-height: 1.45; }
.cartes-centres { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.carte-centre { text-align: left; display: grid; gap: 4px; background: var(--feuille); border: 1px solid var(--trait); border-radius: 14px; padding: 16px 18px; cursor: pointer; font: inherit; color: inherit; }
.carte-centre b { font-size: 16px; }
.carte-centre span { font-size: 13px; color: var(--gris); }
.carte-centre:hover { border-color: var(--trait-fort); }
.carte-centre.active { border-color: #D9AE45; box-shadow: 0 0 0 3px rgba(217,174,69,.18); }
.carte-equipe { border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
.carte-equipe .ce-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; background: var(--feuille-2); border-bottom: 1px solid var(--trait); }
.carte-equipe .tableau td { padding-top: 10px; padding-bottom: 10px; }
tr.choisi td { background: var(--feuille-2); }
.demande { border-top: 1px solid var(--trait); padding: 14px 20px; display: grid; gap: 6px; }
.demande:first-child { border-top: 0; }
.demande .qui { font-size: 13px; color: var(--gris); }
.demande p { white-space: pre-wrap; margin: 0; }
@media (max-width: 760px) { .op-chiffres { grid-template-columns: repeat(2, minmax(0, 1fr)); } .op-tete .role { display: none; } }
</style>
</head>
<body>
<section class="op-connexion" id="ecran-c">
  <div class="op-carte">
  <div class="logo"><svg viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#D9AE45"/><path d="M7.5 5.5v11M7.5 11.5 14 5.5M10.2 9.3 14.5 16.5" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Klerio</div>
  <form id="f-c" novalidate>
    <label class="champ">Email<input class="saisie" id="c-email" type="email" autocomplete="username" required></label>
    <label class="champ">Mot de passe<input class="saisie" id="c-mdp" type="password" autocomplete="current-password" required></label>
    <p class="erreur-form" id="c-err" role="alert"></p>
    <button class="btn primaire" id="c-btn" type="submit">Se connecter</button>
  </form>
  <form id="f-m" novalidate hidden>
    <p style="margin:0;font-weight:600">Choisissez votre mot de passe (12 caractères minimum)</p>
    <label class="champ">Nouveau mot de passe<input class="saisie" id="m-1" type="password" autocomplete="new-password"></label>
    <label class="champ">Confirmation<input class="saisie" id="m-2" type="password" autocomplete="new-password"></label>
    <p class="erreur-form" id="m-err" role="alert"></p>
    <button class="btn primaire" id="m-btn" type="submit">Enregistrer et continuer</button>
  </form>
  </div>
</section>

<div id="ecran-a" hidden>
  <header class="op-tete"><span class="marque" id="logo"></span><span class="role">Klerio Admin</span>
    <span class="droite"><span id="op-nom"></span><button class="btn petit discret" id="b-sortir" type="button">Se déconnecter</button></span></header>
  <main class="op-page" id="vue"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="commun.js?v=20261108c"></script>
<script>
var C = window.CA, $ = C.$, esc = C.esc;
$("logo").innerHTML = C.LOGO + "<span>Klerio</span>";
var sb = window.supabase.createClient(C.SUPABASE_URL, C.CLE_PUBLIQUE, { auth: { persistSession: true, storageKey: "klerio-operateur", storage: window.sessionStorage, autoRefreshToken: true } });
var jeton = function () { return sb.auth.getSession().then(function (r) { return r.data.session ? r.data.session.access_token : null; }); };
var op = function (action, corps) { return C.client(C.SUPABASE_URL + "/functions/v1", jeton)("klerio-plateforme", { body: Object.assign({ action: action }, corps || {}) }); };
var ROLES = { admin: "Administrateur", superviseur: "Manager", gestionnaire: "Gestionnaire" };
var etat = { clients: [], support: [], global: {}, fiche: null, onglet: null, centre: null, ouvrir: false };

function entrer() {
  return op("moi").then(function (m) {
    $("op-nom").textContent = m.nom; $("ecran-c").hidden = true; $("ecran-a").hidden = false; charger();
  }).catch(function (x) { sb.auth.signOut(); $("ecran-c").hidden = false; $("ecran-a").hidden = true; $("c-err").textContent = x.message; });
}
$("f-c").addEventListener("submit", function (e) {
  e.preventDefault(); var b = $("c-btn"); $("c-err").textContent = ""; C.occupe(b, true, "Connexion");
  sb.auth.signInWithPassword({ email: $("c-email").value.trim(), password: $("c-mdp").value }).then(function (r) {
    if (r.error) throw new Error(/invalid/i.test(r.error.message) ? "Email ou mot de passe incorrect." : r.error.message);
    if (r.data.user && r.data.user.user_metadata && r.data.user.user_metadata.mdp_provisoire) { $("f-c").hidden = true; $("f-m").hidden = false; $("m-1").focus(); return; }
    return entrer();
  }).catch(function (x) { $("c-err").textContent = x.message; }).finally(function () { C.occupe(b, false); });
});
$("f-m").addEventListener("submit", function (e) {
  e.preventDefault(); var a = $("m-1").value, b = $("m-2").value, err = $("m-err"); err.textContent = "";
  if (a.length < 12) { err.textContent = "12 caractères minimum."; return; }
  if (a !== b) { err.textContent = "Les deux saisies sont différentes."; return; }
  C.occupe($("m-btn"), true, "Enregistrement");
  sb.auth.updateUser({ password: a, data: { mdp_provisoire: false } }).then(function (r) { if (r.error) throw r.error; return entrer(); })
    .catch(function (x) { err.textContent = x.message; }).finally(function () { C.occupe($("m-btn"), false); });
});
$("b-sortir").onclick = function () { sb.auth.signOut().finally(function () { location.reload(); }); };
sb.auth.getSession().then(function (r) { if (r.data.session) entrer(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () { });

function charger() {
  return Promise.all([op("clients"), op("global")]).then(function (r) { etat.clients = r[0].clients || []; etat.support = r[0].support || []; etat.global = r[1] || {}; rendre(); }).catch(function (x) { C.toast(x.message, true); });
}
function nomClient(id) { var c = etat.clients.filter(function (x) { return x.id === id; })[0]; return c ? c.nom : ""; }
var STATUT_K = { essai: ["Essai", "neutre"], actif: ["Actif", "ok"], suspendu: ["Suspendu", "ko"], resilie: ["Résilié", "ko"] };
function chiffre(v, l, alerte) { return '<div class="c' + (alerte ? " alerte-c" : "") + '"><b>' + v + "</b><span>" + l + "</span></div>"; }
function quand(t) { return t ? C.depuis(t) : "Jamais"; }

function rendre() {
  if (etat.fiche) return rendreFiche(etat.fiche);
  var g = etat.global || {};
  var h = '<div class="entete-vue"><div><h1>Vue d\'ensemble</h1><p>Vos clients, leur activité et le support. Aucun contenu de dossier n\'est visible ici.</p></div><button class="btn primaire" id="b-ouvrir" type="button">Ouvrir un client</button></div>';
  h += '<div class="op-chiffres">' + chiffre(g.clients || 0, "Clients") + chiffre(g.clients_actifs || 0, "Contrats actifs") + chiffre(C.eur(g.revenu_annuel || 0).replace(",00", ""), "Revenu annuel des contrats actifs") + chiffre(etat.support.length, "Demandes de support ouvertes", etat.support.length) + "</div>";
  h += '<div class="op-chiffres">' + chiffre(g.comptes || 0, "Comptes actifs") + chiffre(g.connectes_7j || 0, "Connectés ces 7 jours") + chiffre(g.dossiers_en_cours || 0, "Dossiers en cours") + chiffre(g.dossiers_30j || 0, "Dossiers reçus en 30 jours") + "</div>";
  if (etat.ouvrir) h += '<section class="bloc"><div class="bloc-tete"><h2>Ouvrir un client</h2></div><form class="bloc-corps pile" id="f-o" novalidate><div class="grille-3">' +
    '<label class="champ">Compagnie<input class="saisie" id="o-nom" placeholder="Ex. Mutuelle du Loing"></label><label class="champ">Premier administrateur<input class="saisie" id="o-anom" placeholder="Prénom Nom"></label>' +
    '<label class="champ">Son email professionnel<input class="saisie" id="o-amail" type="email" placeholder="prenom.nom@compagnie.fr"></label></div>' +
    '<div class="decision-actions"><button class="btn primaire" id="o-ok" type="submit">Créer le client et inviter l\'administrateur</button><button class="btn discret" id="o-annuler" type="button">Annuler</button></div></form></section>';
  if (etat.support.length) h += '<section class="bloc"><div class="bloc-tete"><h2>Demandes de support<span class="compte">' + etat.support.length + "</span></h2></div>" + etat.support.map(blocDemande).join("") + "</section>";
  h += '<section class="bloc"><div class="bloc-tete"><h2>Clients<span class="compte">' + etat.clients.length + '</span></h2></div><div class="tableau-wrap"><table class="tableau"><thead><tr><th>Compagnie</th><th class="nb">Comptes</th><th class="nb">Managers</th><th class="nb">Gestionnaires</th><th class="nb">Équipes</th><th class="nb">Dossiers en cours</th><th class="nb">Reçus 30 j</th><th>Dernière connexion</th><th>État</th></tr></thead><tbody>' +
    (etat.clients.map(function (c) {
      var e = !c.admins ? '<span class="statut ko">Sans administrateur</span>' : c.support_ouvert ? '<span class="statut ko">' + c.support_ouvert + " demande(s)</span>" : c.invitations ? '<span class="statut neutre">' + c.invitations + " invitation(s)</span>" : '<span class="statut ok">En ordre</span>';
      return '<tr data-client="' + esc(c.id) + '" style="cursor:pointer"><td><b>' + esc(c.nom) + '</b></td><td class="nb">' + c.comptes + '</td><td class="nb">' + c.managers + '</td><td class="nb">' + c.gestionnaires + '</td><td class="nb">' + c.equipes + '</td><td class="nb">' + c.dossiers_en_cours + '</td><td class="nb">' + c.dossiers_30j + '</td><td class="muet">' + esc(quand(c.derniere_connexion)) + "</td><td>" + e + "</td></tr>";
    }).join("") || '<tr><td colspan="9"><div class="vide">Aucun client pour l\'instant.</div></td></tr>') + "</tbody></table></div></section>";
  if ((g.journal || []).length) h += '<section class="bloc"><div class="bloc-tete"><h2>Vos dernières actions</h2></div>' + tableJournal(g.journal, true) + "</section>";
  $("vue").innerHTML = h;
  $("b-ouvrir").onclick = function () { etat.ouvrir = true; rendre(); $("o-nom").focus(); };
  if ($("f-o")) {
    $("o-annuler").onclick = function () { etat.ouvrir = false; rendre(); };
    $("f-o").addEventListener("submit", function (e) {
      e.preventDefault(); var b = $("o-ok"); C.occupe(b, true, "Création");
      op("ouvrir_client", { nom: $("o-nom").value, admin_nom: $("o-anom").value, admin_email: $("o-amail").value }).then(function (r) {
        etat.ouvrir = false; etat.fiche = r; etat.onglet = "structure";
        C.toast(r.envoi && r.envoi.envoye ? "Client créé, invitation envoyée" : "Client créé, mais le mail n'est pas parti", !(r.envoi && r.envoi.envoye));
        charger();
      }).catch(function (x) { C.occupe(b, false); C.toast(x.message, true); });
    });
  }
  brancherDemandes();
  document.querySelectorAll("[data-client]").forEach(function (tr) { tr.onclick = function () { ouvrirClient(tr.dataset.client); }; });
}
function blocDemande(s) {
  return '<div class="demande"><b>' + esc(s.sujet) + '</b><span class="qui">' + esc(nomClient(s.assureur_id)) + " · " + esc(s.nom || "") + " (" + esc(ROLES[s.role] || s.role || "") + ", " + esc(s.email || "") + ") · " + esc(C.depuis(s.created_at)) + "</span><p>" + esc(s.message) + "</p>" +
    (s.statut && s.statut !== "ouverte" ? "" : '<div class="decision-actions"><textarea class="saisie" data-rep="' + esc(s.id) + '" rows="2" placeholder="Réponse envoyée par mail (facultatif)" style="flex:1;min-width:240px"></textarea><button class="btn petit" data-traiter="' + esc(s.id) + '">Marquer traitée</button></div>') + "</div>";
}
function brancherDemandes() {
  document.querySelectorAll("[data-traiter]").forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.traiter, rep = document.querySelector('[data-rep="' + id + '"]').value.trim(); C.occupe(b, true, "");
      op("support_traiter", { id: id, reponse: rep || null }).then(function () { C.toast(rep ? "Réponse envoyée" : "Demande traitée"); if (etat.fiche) ouvrirClient(etat.fiche.client.id); else charger(); }).catch(function (x) { C.occupe(b, false); C.toast(x.message, true); });
    };
  });
}
var LIB_ACTION = { ouvrir_client: "Client ouvert", inviter_admin: "Administrateur invité", renvoyer: "Invitation renvoyée", reinitialiser: "Lien de mot de passe envoyé", activer: "Compte activé ou désactivé", role: "Rôle changé",
  support_traiter: "Demande de support traitée", contrat: "Contrat modifié", renommer_client: "Client renommé", deplacer: "Personne déplacée", equipe_creer: "Équipe créée", equipe_renommer: "Équipe renommée", equipe_manager: "Manager d'équipe changé", equipe_supprimer: "Équipe supprimée" };
function tableJournal(l, avecClient) {
  return '<div class="tableau-wrap"><table class="tableau"><tbody>' + l.map(function (j) {
    var d = j.details || {}, det = Object.keys(d).filter(function (k) { return ["id", "assureur_id"].indexOf(k) < 0 && d[k] !== null && d[k] !== ""; }).map(function (k) { return k + " : " + d[k]; }).join(", ");
    return '<tr style="cursor:default"><td class="muet" style="white-space:nowrap">' + esc(C.heure(j.created_at)) + "</td>" + (avecClient ? "<td>" + esc(j.client || "") + "</td>" : "") + "<td><b>" + esc(LIB_ACTION[j.action] || j.action) + '</b><div class="muet petit">' + esc(det.slice(0, 160)) + '</div></td><td class="muet">' + esc(j.operateur) + "</td></tr>";
  }).join("") + "</tbody></table></div>";
}

function ouvrirClient(id) {
  op("client", { id: id }).then(function (f) { etat.fiche = f; etat.onglet = etat.onglet || "structure"; etat.centre = null; rendreFiche(f); window.scrollTo(0, 0); }).catch(function (x) { C.toast(x.message, true); });
}
function maj(p, msg) {
  return p.then(function (r) { if (r && r.client) etat.fiche = r; if (r && r.envoi) C.toast(r.envoi.envoye ? "Mail envoyé à " + r.envoi.email : "Mail non parti : " + (r.envoi.erreur || ""), !r.envoi.envoye); else if (msg) C.toast(msg); rendreFiche(etat.fiche); })
    .catch(function (x) { C.toast(x.message, true); rendreFiche(etat.fiche); });
}
var ONGLETS = [["structure", "Centres et équipes"], ["comptes", "Comptes"], ["contrat", "Contrat"], ["support", "Support"], ["journal", "Journal"]];

function rendreFiche(f) {
  var s = f.structure || {}, k = s.contrat || {}, st = STATUT_K[k.statut || "essai"];
  var actifs = f.comptes.filter(function (g) { return g.actif; });
  var h = '<p><a href="#" id="b-retour" class="muet">← Tous les clients</a></p><div class="entete-vue"><div><h1>' + esc(f.client.nom) + ' <span class="statut ' + st[1] + '" style="font-size:13px;vertical-align:middle">' + st[0] + "</span></h1><p>Client depuis le " + esc(C.dateCourte(f.client.created_at)) +
    (k.offre ? " · offre " + esc(k.offre) : "") + (k.fin ? " · échéance le " + esc(C.dateCourte(k.fin)) : "") + "</p></div></div>";
  var gest = actifs.filter(function (g) { return g.role === "gestionnaire"; }).length, man = actifs.filter(function (g) { return g.role === "superviseur"; }).length, adm = actifs.filter(function (g) { return g.role === "admin"; }).length;
  var enCours = (s.centres || []).reduce(function (a, c) { return a + c.dossiers_en_cours; }, 0);
  h += '<div class="op-chiffres">' + chiffre((s.centres || []).filter(function (c) { return c.nom; }).length, "Centres") + chiffre(f.equipes.length, "Équipes") + chiffre(adm + " · " + man + " · " + gest, "Admin. · managers · gestionnaires", !adm) + chiffre(enCours, "Dossiers en cours") + "</div>";
  h += '<nav class="onglets">' + ONGLETS.map(function (o) { return '<a href="#" data-onglet="' + o[0] + '"' + (o[0] === etat.onglet ? ' aria-current="page"' : "") + ">" + o[1] + (o[0] === "support" && f.support.filter(function (x) { return x.statut === "ouverte"; }).length ? " •" : "") + "</a>"; }).join("") + "</nav>";
  h += ({ structure: ongletStructure, comptes: ongletComptes, contrat: ongletContrat, support: ongletSupport, journal: ongletJournal }[etat.onglet] || ongletStructure)(f);
  $("vue").innerHTML = h;
  $("b-retour").onclick = function (e) { e.preventDefault(); etat.fiche = null; etat.onglet = null; charger(); };
  document.querySelectorAll("[data-onglet]").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); etat.onglet = a.dataset.onglet; rendreFiche(f); }; });
  brancherFiche(f);
}

function ongletStructure(f) {
  var s = f.structure || {}, charge = s.charge || {};
  var centres = (s.centres || []);
  var h = '<div class="cartes-centres">' + centres.map(function (c) {
    return '<button type="button" class="carte-centre' + (etat.centre === (c.nom || "") ? " active" : "") + '" data-centre="' + esc(c.nom || "") + '"><b>' + esc(c.nom || "Sans centre") + "</b><span>" + c.equipes.length + " équipe(s) · " + c.managers + " manager(s) · " + c.gestionnaires + " gestionnaire(s)</span><span>" + c.dossiers_en_cours + " dossiers en cours · " + c.dossiers_30j + " reçus en 30 j</span></button>";
  }).join("") + "</div>";
  var c = centres.filter(function (x) { return (x.nom || "") === etat.centre; })[0];
  if (c) {
    var managers = f.comptes.filter(function (g) { return g.role === "superviseur" && g.actif; });
    h += '<section class="bloc"><div class="bloc-tete"><h2>' + esc(c.nom || "Sans centre") + '</h2></div><div class="bloc-corps pile">' +
      (c.equipes.length ? c.equipes.map(function (e) {
        var membres = f.comptes.filter(function (g) { return g.equipe_id === e.id; });
        return '<div class="carte-equipe"><div class="ce-tete"><input class="saisie" data-eq-nom="' + esc(e.id) + '" value="' + esc(e.nom) + '" style="max-width:260px;font-weight:600"><button class="btn petit" data-eq-renommer="' + esc(e.id) + '">Renommer</button>' +
          '<label class="muet petit" style="margin-left:auto">Manager <select class="saisie" data-eq-manager="' + esc(e.id) + '" style="min-width:180px"><option value="">Aucun</option>' + managers.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === e.manager_id ? " selected" : "") + ">" + esc(m.nom) + "</option>"; }).join("") + "</select></label>" +
          (membres.filter(function (g) { return g.actif; }).length ? "" : '<button class="btn petit discret" data-eq-suppr="' + esc(e.id) + '">Supprimer</button>') + "</div>" +
          '<table class="tableau"><tbody>' + (membres.map(function (g) {
            return "<tr><td>" + esc(g.nom) + (g.id === e.manager_id ? ' <span class="muet petit">(manager)</span>' : "") + '</td><td class="muet">' + esc(g.email) + "</td><td>" + esc(ROLES[g.role]) + '</td><td class="nb">' + (charge[g.id] || 0) + ' en cours</td><td class="muet">' + esc(quand(g.derniere_connexion)) + "</td><td>" + (g.actif ? '<span class="statut ok">Actif</span>' : '<span class="statut neutre">Désactivé</span>') + "</td></tr>";
          }).join("") || '<tr><td><span class="muet">Aucun membre</span></td></tr>') + "</tbody></table></div>";
      }).join("") : '<p class="muet">Aucune équipe dans ce centre.</p>') +
      '<div class="decision-actions"><input class="saisie" id="eq-nouveau" placeholder="Nom de la nouvelle équipe" style="max-width:280px"><button class="btn" id="eq-creer" data-c="' + esc(c.nom || "") + '">Créer l\'équipe dans ce centre</button></div></div></section>';
  } else h += '<p class="muet">Cliquez sur un centre pour voir ses équipes et leurs membres.</p>';
  return h;
}
function ongletComptes(f) {
  var opts = function (sel) { return '<option value="">Sans équipe</option>' + f.equipes.map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === sel ? " selected" : "") + ">" + esc(e.nom) + " (" + esc(e.centre) + ")</option>"; }).join(""); };
  var charge = (f.structure || {}).charge || {};
  var h = '<section class="bloc"><div class="tableau-wrap"><table class="tableau"><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Équipe</th><th>Centre</th><th class="nb">En cours</th><th>Dernière connexion</th><th>État</th><th></th></tr></thead><tbody>' +
    (f.comptes.map(function (g) {
      return '<tr style="cursor:default"><td>' + esc(g.nom) + '</td><td class="muet">' + esc(g.email) + '</td><td><select class="saisie" data-role="' + esc(g.id) + '">' + Object.keys(ROLES).map(function (r) { return '<option value="' + r + '"' + (r === g.role ? " selected" : "") + ">" + ROLES[r] + "</option>"; }).join("") + "</select></td>" +
        '<td><select class="saisie" data-equipe="' + esc(g.id) + '" style="min-width:170px">' + opts(g.equipe_id) + '</select></td><td><input class="saisie" data-centre="' + esc(g.id) + '" value="' + esc(g.centre || "") + '" placeholder="Aucun" style="max-width:140px"></td><td class="nb">' + (charge[g.id] || 0) + '</td><td class="muet">' + esc(quand(g.derniere_connexion)) + "</td>" +
        "<td>" + (g.actif ? '<span class="statut ok">Actif</span>' : '<span class="statut neutre">Désactivé</span>') + '</td><td class="nb" style="white-space:nowrap"><button class="btn petit" data-mdp="' + esc(g.id) + '" data-nom="' + esc(g.nom) + '">Lien mot de passe</button> <button class="btn petit discret" data-actif="' + esc(g.id) + '" data-val="' + (!g.actif) + '" data-nom="' + esc(g.nom) + '">' + (g.actif ? "Désactiver" : "Réactiver") + "</button></td></tr>";
    }).join("") || '<tr><td colspan="9"><div class="vide">Aucun compte activé.</div></td></tr>') + "</tbody></table></div></section>";
  if (f.invitations.length) h += '<section class="bloc"><div class="bloc-tete"><h2>Invitations en attente</h2></div><div class="tableau-wrap"><table class="tableau"><tbody>' + f.invitations.map(function (i) {
    return "<tr><td>" + esc(i.nom) + '</td><td class="muet">' + esc(i.email) + "</td><td>" + esc(ROLES[i.role] || i.role) + '</td><td class="muet">par ' + esc(i.invite_par_nom || "") + "</td><td>" + (i.expiree ? '<span class="statut ko">Lien expiré</span>' : i.erreur_envoi ? '<span class="statut ko">Mail non parti</span>' : '<span class="statut neutre">Envoyée ' + esc(C.depuis(i.envoye_le)) + "</span>") + '</td><td class="nb"><button class="btn petit" data-renvoyer="' + esc(i.id) + '">Renvoyer</button></td></tr>';
  }).join("") + "</tbody></table></div></section>";
  h += '<section class="bloc"><div class="bloc-tete"><h2>Inviter un administrateur</h2></div><form class="bloc-corps" id="f-adm" novalidate><div class="decision-actions"><input class="saisie" id="a-nom" placeholder="Prénom Nom" style="max-width:240px"><input class="saisie" id="a-mail" type="email" placeholder="prenom.nom@compagnie.fr" style="max-width:300px"><button class="btn" id="a-ok" type="submit">Envoyer l\'invitation</button></div></form></section>';
  return h;
}
function ongletContrat(f) {
  var k = (f.structure || {}).contrat || {};
  var v = function (x) { return esc(x == null ? "" : x); };
  return '<section class="bloc"><form class="bloc-corps pile" id="f-k" novalidate><div class="grille-3">' +
    '<label class="champ">Nom du client<input class="saisie" id="k-client" value="' + v(f.client.nom) + '"></label>' +
    '<label class="champ">Statut<select class="saisie" id="k-statut">' + Object.keys(STATUT_K).map(function (s) { return '<option value="' + s + '"' + ((k.statut || "essai") === s ? " selected" : "") + ">" + STATUT_K[s][0] + "</option>"; }).join("") + "</select></label>" +
    '<label class="champ">Offre<input class="saisie" id="k-offre" value="' + v(k.offre) + '" placeholder="Ex. Contractuel, pilote 6 mois"></label></div><div class="grille-3">' +
    '<label class="champ">Début<input class="saisie" id="k-debut" type="date" value="' + v(k.debut) + '"></label><label class="champ">Échéance<input class="saisie" id="k-fin" type="date" value="' + v(k.fin) + '"></label>' +
    '<label class="champ">Prix annuel HT (€)<input class="saisie" id="k-prix" type="number" min="0" step="100" value="' + v(k.prix_annuel_eur) + '"></label></div><div class="grille-3">' +
    '<label class="champ">Utilisateurs prévus<input class="saisie" id="k-max" type="number" min="0" value="' + v(k.utilisateurs_max) + '"></label><label class="champ">Contact chez le client<input class="saisie" id="k-cnom" value="' + v(k.contact_nom) + '"></label>' +
    '<label class="champ">Email du contact<input class="saisie" id="k-cmail" type="email" value="' + v(k.contact_email) + '"></label></div>' +
    '<label class="champ">Notes<textarea class="saisie" id="k-notes" rows="4">' + v(k.notes) + "</textarea></label>" +
    '<div class="decision-actions"><button class="btn primaire" id="k-ok" type="submit">Enregistrer</button>' + (k.maj_le ? '<span class="muet petit">Modifié ' + esc(C.depuis(k.maj_le)) + "</span>" : "") + "</div></form></section>";
}
function ongletSupport(f) { return '<section class="bloc">' + (f.support.map(blocDemande).join("") || '<div class="vide">Aucune demande de support de ce client.</div>') + "</section>"; }
function ongletJournal(f) { var j = (f.structure || {}).journal || []; return '<section class="bloc">' + (j.length ? tableJournal(j, false) : '<div class="vide">Aucune action de votre part chez ce client.</div>') + "</section>"; }

function brancherFiche(f) {
  var id = f.client.id;
  document.querySelectorAll("[data-centre]").forEach(function (b) { if (b.tagName === "BUTTON") b.onclick = function () { etat.centre = b.dataset.centre; rendreFiche(f); }; });
  document.querySelectorAll("[data-eq-renommer]").forEach(function (b) { b.onclick = function () { maj(op("equipe_renommer", { id: b.dataset.eqRenommer, nom: document.querySelector('[data-eq-nom="' + b.dataset.eqRenommer + '"]').value }), "Équipe renommée"); }; });
  document.querySelectorAll("[data-eq-manager]").forEach(function (s) { s.onchange = function () { maj(op("equipe_manager", { id: s.dataset.eqManager, manager_id: s.value || null }), "Manager changé"); }; });
  document.querySelectorAll("[data-eq-suppr]").forEach(function (b) { b.onclick = function () { if (confirm("Supprimer cette équipe vide ?")) maj(op("equipe_supprimer", { id: b.dataset.eqSuppr }), "Équipe supprimée"); }; });
  if ($("eq-creer")) $("eq-creer").onclick = function () { maj(op("equipe_creer", { assureur_id: id, centre: this.dataset.c, nom: $("eq-nouveau").value }), "Équipe créée"); };
  document.querySelectorAll("select[data-role]").forEach(function (s) { s.onchange = function () { maj(op("role", { id: s.dataset.role, role: s.value }), "Rôle changé"); }; });
  document.querySelectorAll("select[data-equipe]").forEach(function (s) { s.onchange = function () { maj(op("deplacer", { id: s.dataset.equipe, equipe_id: s.value || null }), "Équipe changée"); }; });
  document.querySelectorAll("input[data-centre]").forEach(function (i) { i.onchange = function () { maj(op("deplacer", { id: i.dataset.centre, centre: i.value }), "Centre changé"); }; });
  document.querySelectorAll("[data-mdp]").forEach(function (b) { b.onclick = function () { if (confirm("Envoyer à " + b.dataset.nom + " un lien pour choisir un nouveau mot de passe ?")) { C.occupe(b, true, ""); maj(op("reinitialiser", { id: b.dataset.mdp })); } }; });
  document.querySelectorAll("[data-actif]").forEach(function (b) { b.onclick = function () { var on = b.dataset.val === "true"; if (on || confirm("Désactiver le compte de " + b.dataset.nom + " ? Il ne pourra plus se connecter.")) maj(op("activer", { id: b.dataset.actif, actif: on }), on ? "Compte réactivé" : "Compte désactivé"); }; });
  document.querySelectorAll("[data-renvoyer]").forEach(function (b) { b.onclick = function () { C.occupe(b, true, ""); maj(op("renvoyer", { id: b.dataset.renvoyer })); }; });
  if ($("f-adm")) $("f-adm").addEventListener("submit", function (e) { e.preventDefault(); C.occupe($("a-ok"), true, "Envoi"); maj(op("inviter_admin", { assureur_id: id, nom: $("a-nom").value, email: $("a-mail").value })); });
  if ($("f-k")) $("f-k").addEventListener("submit", function (e) {
    e.preventDefault(); C.occupe($("k-ok"), true, "Enregistrement");
    var nom = $("k-client").value.trim(), suite = nom && nom !== f.client.nom ? op("renommer_client", { assureur_id: id, nom: nom }) : Promise.resolve();
    maj(suite.then(function () { return op("contrat", { assureur_id: id, statut: $("k-statut").value, offre: $("k-offre").value, debut: $("k-debut").value, fin: $("k-fin").value,
      prix_annuel_eur: $("k-prix").value === "" ? null : Number($("k-prix").value), utilisateurs_max: $("k-max").value === "" ? null : Number($("k-max").value),
      contact_nom: $("k-cnom").value, contact_email: $("k-cmail").value, notes: $("k-notes").value }); }), "Contrat enregistré");
  });
  brancherDemandes();
}
</script>
</body>
</html>
