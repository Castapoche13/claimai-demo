<style>
body { background: var(--papier); }
/* ---------- Connexion ---------- */
.op-connexion { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px;
  background: radial-gradient(1100px 600px at 50% -10%, rgba(217,174,69,.16), transparent 60%), radial-gradient(800px 500px at 50% 110%, rgba(46,77,158,.18), transparent 60%), #0E0E10; }
.op-carte { width: min(380px, 100%); display: grid; gap: 28px; justify-items: center; }
.op-carte .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: #F3F3F1; letter-spacing: -0.01em; }
.op-carte .logo svg { width: 34px; height: 34px; }
.op-connexion form { width: 100%; display: grid; gap: 16px; padding: 28px; border-radius: 16px; color: #ECECEE;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025)); border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 24px 60px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.op-connexion form .champ { color: #A2A2AA; font-size: 13px; }
.op-connexion form .saisie { height: 44px; background: rgba(0,0,0,.35); color: #F3F3F1; border: 1px solid rgba(255,255,255,.12); }
.op-connexion form .saisie:focus { border-color: #D9AE45; box-shadow: 0 0 0 3px rgba(217,174,69,.18); outline: none; }
.op-connexion form[hidden] { display: none; }
.op-connexion .erreur-form { color: #F28B82; }
.op-connexion .btn.primaire { height: 44px; justify-content: center; background: #D9AE45; color: #09090B; border-color: #D9AE45; font-weight: 600; }
.op-connexion .btn.primaire:hover { background: #E4BC57; }
.op-connexion .btn:not(.primaire) { height: 44px; justify-content: center; background: transparent; color: #ECECEE; border: 1px solid rgba(255,255,255,.16); }
.op-connexion .btn:not(.primaire):hover { background: rgba(255,255,255,.06); }

/* ---------- Cadre : menu à gauche, page à droite ---------- */
.ad { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.ad[hidden] { display: none; }
.ad-menu { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px; padding: 18px 12px; background: var(--feuille); border-right: 1px solid var(--trait); }
.ad-marque { display: flex; align-items: center; gap: 10px; padding: 2px 8px; font-weight: 600; font-size: 15px; color: var(--encre); }
.ad-marque svg { width: 26px; height: 26px; flex: none; }
.ad-marque small { display: block; font-size: 12px; font-weight: 400; color: var(--gris); margin-top: 1px; }
.ad-menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ad-menu ul a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--encre-2); font-size: 14px; text-decoration: none; }
.ad-menu ul a svg { color: var(--gris); flex: none; }
.ad-menu ul a:hover { background: var(--survol); color: var(--encre); }
.ad-menu ul a[aria-current="page"] { background: var(--papier); color: var(--encre); font-weight: 500; box-shadow: inset 3px 0 0 #D9AE45; }
.ad-menu ul a[aria-current="page"] svg { color: #B8892A; }
.ad-menu .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--gris); }
.ad-menu .n.chaud { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: #D9AE45; color: #17130A; font-weight: 600; }
.ad-bas { margin-top: auto; display: grid; gap: 6px; padding: 12px 10px 0; border-top: 1px solid var(--trait); }
.ad-bas b { font-size: 13.5px; font-weight: 500; color: var(--encre); }
.ad-bas span { font-size: 12.5px; color: var(--gris); overflow: hidden; text-overflow: ellipsis; }
.ad-bas button { justify-self: start; border: 0; background: none; padding: 2px 0; font: inherit; font-size: 13px; color: var(--gris); cursor: pointer; }
.ad-bas button:hover { color: var(--encre); }
.ad-page { padding: 32px 40px 72px; max-width: 1180px; width: 100%; display: grid; gap: 24px; align-content: start; }

/* ---------- En-tête de page ---------- */
.ad-tete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ad-tete h1 { font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: -0.01em; }
.ad-tete p { margin: 6px 0 0; color: var(--gris); }
.ad-alerte { margin: 16px 0 0; padding: 12px 16px; border: 1px solid var(--rouge-texte, #B42318); border-radius: 10px; color: var(--encre); background: color-mix(in srgb, var(--rouge-texte, #B42318) 7%, transparent); font-size: 14px; line-height: 1.5; }
.ad-fil { font-size: 13px; color: var(--gris); margin-bottom: 8px; }
.ad-fil a { color: var(--gris); }
.ad-fil a:hover { color: var(--encre); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; vertical-align: middle; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--vert-texte); background: var(--vert-pale); }
.pill.essai { color: var(--jaune-texte); background: var(--jaune-pale); }
.pill.ko { color: var(--rouge-texte); background: var(--rouge-pale); }
.pill.neutre { color: var(--gris); background: var(--survol); }

/* ---------- Bande de chiffres : un seul cadre, quatre cases ---------- */
.ad-bande { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--feuille); border: 1px solid var(--trait); border-radius: 14px; }
.ad-bande > div { padding: 18px 20px; display: grid; gap: 4px; align-content: start; }
.ad-bande > div + div { border-left: 1px solid var(--trait); }
.ad-bande .l { font-size: 13px; color: var(--gris); }
.ad-bande .v { font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -0.02em; color: var(--encre); font-variant-numeric: tabular-nums; }
.ad-bande .s { font-size: 12.5px; color: var(--gris); }
.ad-bande .s b { color: var(--encre-2); font-weight: 500; }

/* ---------- À traiter ---------- */
.ad-taches { list-style: none; margin: 0; padding: 0; }
.ad-taches li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--trait); }
.ad-taches li:first-child { border-top: 0; }
.ad-taches .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--gris-clair); }
.ad-taches .pt.rouge { background: var(--rouge); box-shadow: 0 0 0 4px var(--rouge-pale); }
.ad-taches .pt.or { background: #D9AE45; box-shadow: 0 0 0 4px rgba(217,174,69,.16); }
.ad-taches b { display: block; font-weight: 500; color: var(--encre); }
.ad-taches span { display: block; font-size: 13px; color: var(--gris); margin-top: 1px; }
.ad-calme { display: flex; align-items: center; gap: 12px; padding: 18px 20px; color: var(--gris); }
.ad-calme svg { color: var(--vert); flex: none; }

/* ---------- Tableau des clients ---------- */
.ad-t { width: 100%; border-collapse: collapse; }
.ad-t th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--gris); padding: 10px 14px; border-bottom: 1px solid var(--trait); white-space: nowrap; }
.ad-t td { padding: 13px 14px; border-bottom: 1px solid var(--trait); vertical-align: middle; }
.ad-t tr:last-child td { border-bottom: 0; }
.ad-t th:first-child, .ad-t td:first-child { padding-left: 20px; }
.ad-t th:last-child, .ad-t td:last-child { padding-right: 20px; }
.ad-t .nb { text-align: right; font-variant-numeric: tabular-nums; }
.ad-t td small { display: block; font-size: 12.5px; color: var(--gris); margin-top: 1px; }
.ad-t tbody tr[data-client] { cursor: pointer; }
.ad-t tbody tr[data-client]:hover td { background: var(--feuille-2); }
.ad-t .fl { color: var(--gris-clair); width: 20px; }
.ad-t tbody tr[data-client]:hover .fl { color: var(--encre); }
.sante { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.sante::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--vert); }
.sante.or::before { background: #D9AE45; } .sante.rouge::before { background: var(--rouge); } .sante.gris::before { background: var(--gris-clair); }
.ad-outils { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--trait); }
.ad-outils .saisie { max-width: 280px; height: 34px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--survol); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font: inherit; font-size: 13px; font-weight: 500; color: var(--gris); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--feuille); color: var(--encre); box-shadow: 0 0 0 1px var(--trait); }

/* ---------- Fiche client ---------- */
.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--trait); overflow-x: auto; }
.onglets a { padding: 10px 12px; font-size: 14px; font-weight: 500; color: var(--gris); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; text-decoration: none; }
.onglets a:hover { color: var(--encre); text-decoration: none; }
.onglets a[aria-current="page"] { color: var(--encre); border-bottom-color: #D9AE45; }
.onglets .n { font-family: var(--mono); font-size: 12px; color: var(--gris); margin-left: 6px; }
.org { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.ad-page .bloc + .bloc { margin-top: 0; }
.org-centres { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.org-centres button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 9px; font: inherit; color: var(--encre-2); cursor: pointer; display: grid; gap: 2px; }
.org-centres button b { font-weight: 500; color: var(--encre); }
.org-centres button span { font-size: 12.5px; color: var(--gris); }
.org-centres button:hover { background: var(--survol); }
.org-centres button[aria-pressed="true"] { background: var(--papier); box-shadow: inset 3px 0 0 #D9AE45; }
.equipe + .equipe { border-top: 1px solid var(--trait); }
.equipe-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 20px 10px; }
.equipe-tete h3 { font-size: 15px; font-weight: 500; }
.equipe-tete .muet { font-size: 13px; }
.equipe-tete .droite { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.equipe-tete label { display: flex; align-items: center; gap: 8px; }
.ad-page .bloc-tete { display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 12px; }
.ad-page .bloc-tete h2 { flex: 1 1 auto; min-width: 0; }
.bloc-tete .sous { font-size: 13px; font-weight: 400; color: var(--gris); margin-left: 8px; }
.ad-t select[data-role] { min-width: 150px; }
.ad-t select[data-equipe] { min-width: 230px; }
.equipe .ad-t td { padding-top: 10px; padding-bottom: 10px; }
.ligne-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ligne-form .saisie { height: 36px; }
.ad-t .saisie { height: 32px; padding-top: 0; padding-bottom: 0; }
.demande { padding: 16px 20px; display: grid; gap: 8px; border-top: 1px solid var(--trait); }
.demande:first-child { border-top: 0; }
.demande .qui { font-size: 13px; color: var(--gris); }
.demande p { white-space: pre-wrap; margin: 0; color: var(--encre-2); }
.demande .rep { display: grid; gap: 8px; margin-top: 4px; }
.demande .rep .ligne-form { justify-content: flex-end; }
.grille-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pile { display: grid; gap: 16px; }
.ad-journal td:first-child { white-space: nowrap; color: var(--gris); }

.ad-etapes { list-style: none; margin: 0; padding: 4px 0; }
.ad-etapes li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 20px; }
.ad-etapes li + li { border-top: 1px solid var(--trait); }
.ad-etapes .pt { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--gris-clair); margin-top: 7px; }
.ad-etapes .pt.rouge { background: var(--rouge); box-shadow: 0 0 0 4px var(--rouge-pale); }
.ad-etapes .pt.vert { background: var(--vert, #2f8f5b); }
.ad-etapes li div { display: grid; gap: 2px; }
.ad-etapes li span:not(.pt):not(.muet) { color: var(--gris); font-size: 13px; }
.mes-apercu { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--trait); border-top: 4px solid #1f4e8c; border-radius: 8px; min-height: 64px; align-content: center; }
.mes-apercu img { max-height: 30px; max-width: 160px; }
.mes-apercu span { font-size: 12px; color: var(--gris); word-break: break-all; }
.j-filtres { align-items: flex-end; flex-wrap: wrap; }
.j-filtres .champ { min-width: 150px; }
.ad-actions { white-space: nowrap; }
.tableau-wrap { overflow-x: auto; }
@media (max-width: 600px) {
  .ad-comptes thead { display: none; }
  .ad-comptes, .ad-comptes tbody, .ad-comptes tr, .ad-comptes td { display: block; width: 100%; }
  .ad-comptes tr { padding: 12px 16px; border-top: 1px solid var(--trait); }
  .ad-comptes td { padding: 4px 0 !important; border: 0 !important; }
  .ad-comptes td select { width: 100%; min-width: 0 !important; }
  .ad-comptes .ad-actions { white-space: normal; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; }
}
@media (max-width: 960px) {
  .ad { grid-template-columns: minmax(0, 1fr); }
  .ad-menu, .ad-page, .ad-page > * { min-width: 0; }
  .ad-page { grid-template-columns: minmax(0, 1fr); }
  .ad-menu ul { max-width: 100%; }
  .ad-menu { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--trait); }
  .ad-menu ul { display: flex; overflow-x: auto; }
  .ad-bas { display: none; }
  .ad-page { padding: 24px 16px 56px; }
  .ad-bande { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-bande > div:nth-child(3) { border-left: 0; }
  .ad-bande > div:nth-child(n+3) { border-top: 1px solid var(--trait); }
  .org, .grille-3 { grid-template-columns: 1fr; }
  .ad-t .masque-m { display: none; }
}
</style>

<body>
<section class="op-connexion" id="ecran-c">
  <div class="op-carte">
  <div class="logo"><svg viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#D9AE45"/><path d="M7.5 5.5v11M7.5 11.5 14 5.5M10.2 9.3 14.5 16.5" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Klerio</div>
  <form id="f-c" novalidate>
    <label class="champ">Email<input class="saisie" id="c-email" type="email" autocomplete="username" required></label>
    <label class="champ">Mot de passe<input class="saisie" id="c-mdp" type="password" autocomplete="current-password" required></label>
    <div class="oubli-l"><button type="button" class="lien-oubli" id="c-oubli">Mot de passe oublié ?</button></div>
    <p class="erreur-form" id="c-err" role="alert"></p>
    <button class="btn primaire" id="c-btn" type="submit">Se connecter</button>
  </form>
  <form id="f-o" novalidate hidden>
    <div><p style="margin:0;font-weight:600;color:#F3F3F1">Mot de passe oublié</p><p style="margin:4px 0 0;font-size:13px;color:#A2A2AA">Vous recevrez un lien pour choisir un nouveau mot de passe.</p></div>
    <label class="champ">Email<input class="saisie" id="o-email" type="email" autocomplete="username" required></label>
    <p class="erreur-form" id="o-err" role="alert"></p>

  </form>
  <form id="f-m" novalidate hidden>
    <p style="margin:0;font-weight:600" id="m-titre">Choisissez votre mot de passe (12 caractères minimum)</p>
    <label class="champ">Nouveau mot de passe<input class="saisie" id="m-1" type="password" autocomplete="new-password"></label>
    <label class="champ">Confirmation<input class="saisie" id="m-2" type="password" autocomplete="new-password"></label>

  </form>
  </div>
</section>

    <div class="ad-marque"><svg viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#D9AE45"/><path d="M7.5 5.5v11M7.5 11.5 14 5.5M10.2 9.3 14.5 16.5" stroke="#09090B" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><div>Klerio Admin<small>Espace Klerio</small></div></div>

</div>

<script>
var C = window.CA, $ = C.$, esc = C.esc;
var sb = window.supabase.createClient(C.SUPABASE_URL, C.CLE_PUBLIQUE, { auth: { persistSession: true, storageKey: "klerio-operateur", storage: window.sessionStorage, autoRefreshToken: true } });
var jeton = function () { return sb.auth.getSession().then(function (r) { return r.data.session ? r.data.session.access_token : null; }); };
C.surveillerInactivite(15, sb); // Klerio Admin agit sur tous les clients : fin de session après 15 minutes sans activité
var opBrut = function (action, corps) { return C.client(C.SUPABASE_URL + "/functions/v1", jeton)("klerio-plateforme", { body: Object.assign({ action: action }, corps || {}) }); };
// Session expirée (onglet resté ouvert longtemps) : on la renouvelle et on rejoue la demande ; sinon retour à la connexion
var op = function (action, corps) {
  return opBrut(action, corps).catch(function (x) {
    if (x.status !== 401) throw x;
    return sb.auth.refreshSession().then(function (r) {
      if (r.error || !r.data.session) throw x;
      return opBrut(action, corps);
    }).catch(function (y) {
      if (y && y.status && y.status !== 401) throw y;
      sb.auth.signOut().catch(function () { });
      $("ecran-a").hidden = true; $("ecran-c").hidden = false; $("f-c").hidden = false; $("f-m").hidden = true;
      $("c-err").textContent = "Votre session a expiré : reconnectez-vous.";
      throw new Error("Session expirée : reconnectez-vous");
    });
  });
};
var ROLES = { admin: "Administrateur", superviseur: "Manager", gestionnaire: "Gestionnaire" };

function entrer() {
  return op("moi").then(function (m) {

  ((f.structure || {}).centres || []).concat(f.equipes).forEach(function (x) { var n = x.nom && x.equipes ? x.nom : x.centre; if (n && centres.indexOf(n) < 0) centres.push(n); });
  h += '<section class="bloc"><div class="bloc-tete"><h2>Créer un accès</h2></div><form class="bloc-corps pile" id="f-adm" novalidate>' +
    '<p class="muet petit" style="margin:0">La personne reçoit un mail pour activer son compte. Un manager placé dans une équipe sans manager en devient le manager ; il invite ensuite ses gestionnaires.</p>' +
    '<div class="grille-3"><label class="champ">Prénom Nom<input class="saisie" id="a-nom"></label><label class="champ">Email professionnel<input class="saisie" id="a-mail" type="email" placeholder="prenom.nom@compagnie.fr"></label>' +
    '<label class="champ">Rôle<select class="saisie" id="a-role"><option value="admin">Administrateur</option><option value="superviseur">Manager</option><option value="gestionnaire">Gestionnaire</option></select></label></div>' +
    '<div class="grille-3" id="a-place" hidden><label class="champ">Centre de gestion<input class="saisie" id="a-centre" list="a-centres" placeholder="ex. Île-de-France"><datalist id="a-centres">' + centres.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + '</datalist></label>' +
    '<label class="champ">Équipe<select class="saisie" id="a-equipe"></select></label><label class="champ" id="a-neq-l">Nom de la nouvelle équipe<input class="saisie" id="a-neq" placeholder="ex. Dommages Paris 1"></label></div>' +
    '<div class="ligne-form"><button class="btn primaire" id="a-ok" type="submit">Envoyer l\'invitation</button></div></form></section>';
  return h;
}
function ongletContrat(f) {
  var k = (f.structure || {}).contrat || {};
  var v = function (x) { return esc(x == null ? "" : x); };
  return '<section class="bloc"><form class="bloc-corps pile" id="f-k" novalidate><div class="grille-3">' +
        '<label class="champ">Statut<select class="saisie" id="k-statut">' + Object.keys(CONTRAT).map(function (s) { return '<option value="' + s + '"' + ((k.statut || "essai") === s ? " selected" : "") + ">" + CONTRAT[s][0] + "</option>"; }).join("") + "</select></label>" +
    '<label class="champ">Offre<input class="saisie" id="k-offre" value="' + v(k.offre) + '" placeholder="Ex. Contractuel, pilote 6 mois"></label></div><div class="grille-3">' +
    '<label class="champ">Début<input class="saisie" id="k-debut" type="date" value="' + v(k.debut) + '"></label><label class="champ">Échéance<input class="saisie" id="k-fin" type="date" value="' + v(k.fin) + '"></label>' +
    '<label class="champ">Prix annuel HT (€)<input class="saisie" id="k-prix" type="number" min="0" step="100" value="' + v(k.prix_annuel_eur) + '"></label></div><div class="grille-3">' +
    '<label class="champ">Utilisateurs prévus<input class="saisie" id="k-max" type="number" min="0" value="' + v(k.utilisateurs_max) + '"></label><label class="champ">Contact chez le client<input class="saisie" id="k-cnom" value="' + v(k.contact_nom) + '"></label>' +
    '<label class="champ">Email du contact<input class="saisie" id="k-cmail" type="email" value="' + v(k.contact_email) + '"></label></div>' +
    '<label class="champ">Notes<textarea class="saisie" id="k-notes" rows="4">' + v(k.notes) + "</textarea></label>" +
    '<div class="ligne-form"><button class="btn primaire" id="k-ok" type="submit">Enregistrer le contrat</button>' + (k.maj_le ? '<span class="muet petit">Modifié ' + esc(C.depuis(k.maj_le)) + "</span>" : "") + "</div></form></section>";
}
/* Mise en service : réglages des mails aux assurés, étapes, passage en réel. Jamais de contenu de dossier. */
function ongletService(f) {
  var m = etat.mes && etat.mes.id === f.client.id ? etat.mes.d : null;
  if (!m) {
    op("mise_en_service", { assureur_id: f.client.id }).then(function (d) { etat.mes = { id: f.client.id, d: d }; if (etat.onglet === "service" && etat.fiche && etat.fiche.client.id === f.client.id) rendreFiche(etat.fiche); })
      .catch(function (x) { C.toast(x.message, true); });
    return '<section class="bloc"><div class="vide">Chargement de la mise en service…</div></section>';
  }
  var r = m.reglages || {}, v = function (x) { return esc(x == null ? "" : x); };
  var requis = m.etapes.filter(function (e) { return e.requis; }), faits = requis.filter(function (e) { return e.ok; }).length;
  var h = '<section class="bloc"><div class="bloc-tete"><h2>Étapes<span class="sous">' + faits + " sur " + requis.length + " obligatoires</span></h2>" +
    '<span class="pill ' + (m.envois === "reel" ? "ok" : "essai") + '">' + (m.envois === "reel" ? "Mails aux assurés : envoi réel" : "Mails aux assurés : mode test, rien ne part") + "</span></div>" +
    '<ul class="ad-etapes">' + m.etapes.map(function (e) {
      return '<li class="' + (e.ok ? "fait" : e.requis ? "manque" : "conseil") + '"><span class="pt ' + (e.ok ? "vert" : e.requis ? "rouge" : "gris") + '"></span><div><b>' + esc(e.titre) + (e.requis ? "" : ' <span class="muet petit">conseillé</span>') + "</b><span>" + esc(e.detail) + "</span></div></li>";
    }).join("") + "</ul>" +
    '<div class="bloc-corps" style="border-top:1px solid var(--trait)"><div class="ligne-form">' +
    (m.envois === "reel" ? '<button class="btn discret" type="button" id="mes-test">Repasser en mode test</button><span class="muet petit">Les mails aux assurés seront alors retenus.</span>'
      : '<button class="btn primaire" type="button" id="mes-reel"' + (m.pret ? "" : " disabled") + '>Passer les envois en réel</button><span class="muet petit">' + (m.pret ? "Les assurés recevront les mails dès la confirmation." : "Terminez d'abord les étapes obligatoires.") + "</span>") +
    "</div></div></section>";
  h += '<section class="bloc"><div class="bloc-tete"><h2>Mails aux assurés</h2></div><form class="bloc-corps pile" id="f-mes" novalidate>' +
    '<p class="muet petit" style="margin:0">Les assurés, garages et experts voient ces réglages : aucun ne mentionne Klerio. L\'adresse d\'envoi doit être sur un domaine du client, vérifié chez l\'hébergeur des mails.</p>' +
    '<div class="grille-3"><label class="champ">Nom de l\'expéditeur<input class="saisie" id="m-nom" maxlength="80" value="' + v(r.expediteur_nom) + '" placeholder="Service sinistres"></label>' +
    '<label class="champ">Adresse d\'envoi<input class="saisie" id="m-adr" type="email" value="' + v(r.expediteur_adresse) + '" placeholder="sinistres@compagnie.fr"></label>' +
    '<label class="champ">Adresse de réception des réponses<input class="saisie" id="m-rec" type="email" value="' + v(r.email_reception) + '" placeholder="sinistres@compagnie.fr"></label></div>' +
    '<div class="grille-3" style="align-items:start"><label class="champ">Logo (adresse https)<input class="saisie" id="m-logo" value="' + v(r.logo_url) + '" placeholder="https://compagnie.fr/logo.png"></label>' +
    '<label class="champ">Couleur principale<span style="display:flex;gap:8px;align-items:center"><input type="color" id="m-coul-p" value="' + v(r.couleur || "#1f4e8c") + '" aria-label="Choisir la couleur"><input class="saisie" id="m-coul" value="' + v(r.couleur) + '" placeholder="#1f4e8c" maxlength="7" style="max-width:120px;flex:1"></span></label>' +
    '<div class="champ"><span>Aperçu</span><div class="mes-apercu" id="m-apercu"></div></div></div>' +
    '<div class="ligne-form"><button class="btn primaire" id="m-ok" type="submit">Enregistrer</button></div></form></section>';
  return h;
}
function apercuMes() {
  var a = $("m-apercu"); if (!a) return;
  var k = /^#[0-9a-f]{6}$/i.test($("m-coul").value.trim()) ? $("m-coul").value.trim() : "#1f4e8c", logo = $("m-logo").value.trim();
  var nom = (etat.fiche && etat.fiche.client.nom) || "";
  a.style.borderTopColor = k;
  a.innerHTML = (/^https:\/\//.test(logo) ? '<img alt="" referrerpolicy="no-referrer">' : "<b></b>") + "<span></span>";
  if (a.querySelector("img")) { a.querySelector("img").src = logo; a.querySelector("img").alt = nom; } else a.querySelector("b").textContent = nom;
  a.querySelector("span").textContent = ($("m-nom").value.trim() || "Service sinistres") + " <" + ($("m-adr").value.trim() || "adresse d'envoi") + ">";
}
function ongletSupport(f) { return '<section class="bloc">' + (f.support.map(function (s) { return blocDemande(s, false); }).join("") || '<div class="vide">Aucune demande de support de ce client.</div>') + "</section>"; }
function ongletJournal(f) { var j = (f.structure || {}).journal || []; return '<section class="bloc">' + (j.length ? tableJournal(j, false) : '<div class="vide">Aucune modification faite chez ce client depuis Klerio Admin.</div>') + "</section>"; }

function brancherFiche(f) {
  var id = f.client.id;
  document.querySelectorAll("[data-centre-choisi]").forEach(function (b) { b.onclick = function () { etat.centre = b.dataset.centreChoisi; rendreFiche(f); }; });
  document.querySelectorAll("[data-eq-renommer]").forEach(function (b) { b.onclick = function () { var nom = prompt("Nouveau nom de l'équipe", b.dataset.nom); if (nom && nom.trim() && nom.trim() !== b.dataset.nom) maj(op("equipe_renommer", { id: b.dataset.eqRenommer, nom: nom.trim() }), "Équipe renommée"); }; });
  document.querySelectorAll("[data-eq-manager]").forEach(function (s) { s.onchange = function () {
    var choisi = s.options[s.selectedIndex] ? s.options[s.selectedIndex].text : "";
    if (!confirm(s.value ? "Confier cette équipe à " + choisi + " ? S'il dirigeait une autre équipe, il la quitte." : "Retirer le manager de cette équipe ? Ses gestionnaires resteront sans manager.")) { rendreFiche(f); return; }
    maj(op("equipe_manager", { id: s.dataset.eqManager, manager_id: s.value || null }), "Manager changé");
  }; });
  document.querySelectorAll("[data-eq-suppr]").forEach(function (b) { b.onclick = function () { if (confirm("Supprimer cette équipe vide ?")) maj(op("equipe_supprimer", { id: b.dataset.eqSuppr }), "Équipe supprimée"); }; });
  if ($("eq-creer")) $("eq-creer").onclick = function () {
    var centre = $("eq-centre") ? $("eq-centre").value : this.dataset.c;
    maj(op("equipe_creer", { assureur_id: id, centre: centre, nom: $("eq-nouveau").value }), "Équipe créée");
  };
  document.querySelectorAll("select[data-role]").forEach(function (s) { s.onchange = function () {
    var msg = s.dataset.nom + " passe de " + (ROLES[s.dataset.avant] || s.dataset.avant) + " à " + ROLES[s.value] + "." +
      (s.value === "admin" ? " Un administrateur voit et règle tout chez ce client." : s.dataset.avant === "admin" ? " Il perdra l'accès aux réglages de la compagnie." : "") + " Confirmer ?";
    if (!confirm(msg)) { s.value = s.dataset.avant; return; }
    var g = f.comptes.filter(function (x) { return x.id === s.dataset.role; })[0] || {}, p = { id: s.dataset.role, role: s.value };
    if (s.value === "superviseur" && !g.centre) {
      var centre = prompt("Un manager dirige une équipe dans un centre de gestion. Centre de " + s.dataset.nom + " :", "");
      if (!centre || !centre.trim()) { s.value = s.dataset.avant; return C.toast("Indiquez le centre de gestion du manager", true); }
      p.centre = centre.trim();
    }
    maj(op("role", p), "Rôle changé");
  }; });
  document.querySelectorAll("[data-annuler-inv]").forEach(function (b) { b.onclick = function () { if (confirm("Annuler l'invitation de " + b.dataset.nom + " ? Son lien ne fonctionnera plus.")) { C.occupe(b, true, ""); maj(op("annuler_invitation", { id: b.dataset.annulerInv }), "Invitation annulée"); } }; });
  document.querySelectorAll("[data-suspendre]").forEach(function (b) { b.onclick = function () {
    if (b.dataset.suspendre === "oui") {
      var motif = prompt("Suspendre l'accès de " + f.client.nom + " : plus personne ne pourra se connecter, les clés API seront refusées et les mails aux assurés retenus.\n\nMotif (obligatoire) :");
      if (motif === null) return;
      if (!motif.trim()) return C.toast("Indiquez le motif de la suspension", true);
      maj(op("suspendre", { assureur_id: id, suspendre: true, motif: motif.trim() }), "Accès suspendu").then(function () { charger(); });
    } else if (confirm("Rétablir l'accès de " + f.client.nom + " ? Les connexions reprennent et les mails retenus partent.")) {
      maj(op("suspendre", { assureur_id: id, suspendre: false }), "Accès rétabli").then(function () { charger(); });
    }
  }; });
  document.querySelectorAll("select[data-equipe]").forEach(function (s) { s.onchange = function () {
    var g = f.comptes.filter(function (x) { return x.id === s.dataset.equipe; })[0] || {}, nb = ((f.structure || {}).charge || {})[g.id] || 0;
    var eq = f.equipes.filter(function (e) { return e.id === s.value; })[0], autreCentre = eq && g.centre && eq.centre !== g.centre;
    var msg = s.value ? "Placer " + g.nom + " dans l'équipe " + eq.nom + " (" + eq.centre + ") ?" : "Retirer " + g.nom + " de son équipe ?";
    if (nb && autreCentre) msg += "\n\nSes " + plur(nb, "dossier") + " en cours du centre " + g.centre + " seront réaffectés à d'autres gestionnaires de ce centre. Ce n'est pas annulable.";
    else if (nb) msg += "\n\nIl garde ses " + plur(nb, "dossier") + " en cours s'ils restent dans son centre.";
    if (!confirm(msg)) { s.value = g.equipe_id || ""; return; }
    maj(op("deplacer", { id: s.dataset.equipe, equipe_id: s.value || null }), "Équipe changée");
  }; });
  document.querySelectorAll("[data-mdp]").forEach(function (b) { b.onclick = function () { if (confirm("Envoyer à " + b.dataset.nom + " un lien pour choisir un nouveau mot de passe ?")) { C.occupe(b, true, ""); maj(op("reinitialiser", { id: b.dataset.mdp })); } }; });
  document.querySelectorAll("[data-actif]").forEach(function (b) { b.onclick = function () {
    var on = b.dataset.val === "true", nb = Number(b.dataset.dossiers || 0);
    var msg = "Désactiver le compte de " + b.dataset.nom + " ? Il ne pourra plus se connecter." + (nb ? " Ses " + plur(nb, "dossier") + " en cours seront réaffectés à d'autres gestionnaires de son centre." : "") + " Ses invitations en attente seront annulées.";
    if (on || confirm(msg)) maj(op("activer", { id: b.dataset.actif, actif: on }), on ? "Compte réactivé" : "Compte désactivé");
  }; });
  if ($("f-mes")) {
    ["m-nom", "m-adr", "m-logo", "m-coul"].forEach(function (i) { $(i).addEventListener("input", apercuMes); });
    $("m-coul-p").addEventListener("input", function () { $("m-coul").value = this.value; apercuMes(); });
    apercuMes();
    $("f-mes").addEventListener("submit", function (e) {
      e.preventDefault(); C.occupe($("m-ok"), true, "Enregistrement");
      op("mise_en_service_maj", { assureur_id: id, expediteur_nom: $("m-nom").value, expediteur_adresse: $("m-adr").value, email_reception: $("m-rec").value, logo_url: $("m-logo").value, couleur: $("m-coul").value })
        .then(function (d) { etat.mes = { id: id, d: d }; C.toast("Réglages enregistrés"); rendreFiche(etat.fiche); })
        .catch(function (x) { C.toast(x.message, true); C.occupe($("m-ok"), false); });
    });
  }
  var envois = function (reel) {
    var p = { assureur_id: id, reel: reel };
    if (reel) {
      var c = prompt("Les assurés de " + f.client.nom + " recevront désormais les mails pour de vrai.\n\nPour confirmer, recopiez le nom du client :");
      if (c === null) return;
      p.confirmation = c;
    } else if (!confirm("Repasser " + f.client.nom + " en mode test ? Plus aucun mail ne partira aux assurés.")) return;
    op("envois_mode", p).then(function (d) { etat.mes = { id: id, d: d }; C.toast(reel ? "Envois aux assurés en réel" : "Envois aux assurés en mode test"); rendreFiche(etat.fiche); }).catch(function (x) { C.toast(x.message, true); });
  };
  if ($("mes-reel")) $("mes-reel").onclick = function () { envois(true); };
  if ($("mes-test")) $("mes-test").onclick = function () { envois(false); };
  document.querySelectorAll("[data-renommer-client]").forEach(function (b) { b.onclick = function () {
    var nom = prompt("Nouveau nom de la compagnie.\n\nLes assurés verront ce nom dès le prochain mail : nom de l'expéditeur, en-tête du portail et des PDF.", f.client.nom);
    if (nom === null) return; nom = nom.trim();
    if (!nom || nom === f.client.nom) return;
    if (!confirm("Renommer « " + f.client.nom + " » en « " + nom + " » ?")) return;
    maj(op("renommer_client", { assureur_id: id, nom: nom }), "Client renommé").then(function () { charger(); });
  }; });
  document.querySelectorAll("[data-renvoyer]").forEach(function (b) { b.onclick = function () { C.occupe(b, true, ""); maj(op("renvoyer", { id: b.dataset.renvoyer })); }; });
  if ($("f-adm")) {
    var majPlace = function () {
      var role = $("a-role").value, centre = $("a-centre").value.trim(), avant = $("a-equipe").value;
      $("a-place").hidden = role === "admin";
      var eqs = f.equipes.filter(function (e) { return e.centre === centre && (role !== "superviseur" || !e.manager_id); });
      $("a-equipe").innerHTML = (role === "gestionnaire" ? '<option value="">Sans équipe pour l\'instant</option>' : "") +
        eqs.map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.nom) + (e.manager ? " (manager : " + esc(e.manager) + ")" : "") + "</option>"; }).join("") + '<option value="+">Nouvelle équipe…</option>';
      if (avant && $("a-equipe").querySelector('option[value="' + avant + '"]')) $("a-equipe").value = avant;
      $("a-neq-l").hidden = $("a-equipe").value !== "+";
    };
    $("a-role").onchange = majPlace; $("a-centre").oninput = majPlace; $("a-equipe").onchange = majPlace; majPlace();
    $("f-adm").addEventListener("submit", function (e) {
      e.preventDefault(); var role = $("a-role").value, eq = $("a-equipe").value;
      var p = { assureur_id: id, nom: $("a-nom").value, email: $("a-mail").value, role: role };
      if (role !== "admin") { p.centre = $("a-centre").value.trim(); if (eq === "+") p.equipe_nom = $("a-neq").value.trim(); else if (eq) p.equipe_id = eq; }
      if (role === "superviseur" && eq === "+" && !p.equipe_nom) return C.toast("Donnez un nom à la nouvelle équipe", true);
      C.occupe($("a-ok"), true, "Envoi"); maj(op("inviter_compte", p), null, true).finally(function () { if ($("a-ok")) C.occupe($("a-ok"), false); });
    });
  }
  if ($("f-k")) $("f-k").addEventListener("submit", function (e) {
    e.preventDefault(); C.occupe($("k-ok"), true, "Enregistrement");
    maj(Promise.resolve().then(function () { return op("contrat", { assureur_id: id, statut: $("k-statut").value, offre: $("k-offre").value, debut: $("k-debut").value, fin: $("k-fin").value,
      prix_annuel_eur: $("k-prix").value === "" ? null : Number($("k-prix").value), utilisateurs_max: $("k-max").value === "" ? null : Number($("k-max").value),
      contact_nom: $("k-cnom").value, contact_email: $("k-cmail").value, notes: $("k-notes").value }); }), "Contrat enregistré", true).then(function () { charger(); }).finally(function () { if ($("k-ok")) C.occupe($("k-ok"), false); });
  });
  brancherDemandes();
}
$("b-actualiser").onclick = function () { etat.fiche = null; charger().then(function () { C.toast("Données à jour"); }); };
document.addEventListener("visibilitychange", function () { if (!document.hidden && !$("ecran-a").hidden) sb.auth.getSession().then(function (r) { if (r.data.session && r.data.session.expires_at * 1000 < Date.now() + 120000) sb.auth.refreshSession(); }); });
$("b-theme").onclick = function () {
  var sombre = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  var t = sombre ? "light" : "dark"; appliquerTheme(t); try { localStorage.setItem(THEME, t); } catch (e) { }
};
